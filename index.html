<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">
<title>放下 · Let Go</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2307080c' width='32' height='32'/%3E%3Cpath d='M7 27 L16 5 L25 27' fill='none' stroke='%23f3efe6' stroke-width='1.2'/%3E%3Ccircle cx='16' cy='18' r='1.5' fill='%23c44536'/%3E%3C/svg%3E">
<style>
  :root { --paper: #f4efe6; --dim: rgba(244,239,230,.66); --cin: #c44536; --ink: #090a0e; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--ink); color: var(--paper);
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
    font-family: "Iowan Old Style", Palatino, "Palatino Linotype", "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "PMingLiU", "SimSun", "WenQuanYi Micro Hei", serif;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  button {
    pointer-events: auto; background: none; border: 0; color: var(--paper);
    font: inherit; letter-spacing: 0.18em; font-size: 13px; opacity: 0.78;
    padding: 12px 10px; cursor: pointer;
  }
  button:hover, button:focus-visible { opacity: 1; }
  button.off { opacity: 0.32; text-decoration: line-through; }
  #bar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 0 calc(8px + env(safe-area-inset-left));
  }
  #bar .left, #bar .right { display: flex; gap: 2px; }
  #title {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    transition: opacity 0.8s ease;
  }
  #title h1 {
    margin: 0; font-weight: 400; font-size: clamp(92px, 15vh, 168px);
    letter-spacing: 0; line-height: 1; text-shadow: 0 2px 2px rgba(0,0,0,0.28), 0 14px 40px rgba(0,0,0,0.5);
  }
  #title h1 span { display: inline-block; margin-left: 0.22em; }
  #sub {
    margin: 0.55em 0 0;
    font-family: "Gill Sans", "Avenir Next", "Trebuchet MS", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
    letter-spacing: 0.62em; text-indent: 0.62em; font-size: 12px; opacity: 0.78;
  }
  #hint {
    position: absolute; left: 50%; bottom: calc(7vh + env(safe-area-inset-bottom));
    transform: translateX(-50%); width: min(92vw, 440px); text-align: center;
    font-size: 14px; letter-spacing: 0.12em; color: var(--paper);
    text-shadow: 0 2px 12px rgba(0,0,0,0.55); opacity: 0; transition: opacity 0.6s ease;
  }
  #meter {
    position: absolute; right: calc(18px + env(safe-area-inset-right));
    top: 16vh; bottom: 14vh; width: 72px; pointer-events: none;
  }
  #meter .track {
    position: absolute; right: 8px; top: 0; bottom: 0; width: 1px;
    background: linear-gradient(to top, rgba(244,239,230,0.25), rgba(196,69,54,0.9));
  }
  #bestMark {
    position: absolute; right: 4px; width: 9px; height: 1px; background: #e6c27a;
    transform: translateY(50%); opacity: 0.9;
  }
  #nowMark {
    position: absolute; right: 3px; width: 11px; height: 11px; border-radius: 50%;
    border: 1px solid var(--paper); background: var(--cin);
    transform: translateY(50%); box-shadow: 0 0 10px rgba(196,69,54,0.55);
  }
  #alt {
    position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
    font-size: 12px; letter-spacing: 0.08em; white-space: nowrap;

  }

    position: absolute; left: 50%; transform: translateX(-50%);
    opacity: 0; transition: opacity 0.45s ease; text-align: center;
  }
  #card {
    bottom: calc(11vh + env(safe-area-inset-bottom));
    width: min(86vw, 300px); padding: 18px 18px 14px;
    background: rgba(10, 10, 12, 0.55);
    border: 1px solid rgba(244, 239, 230, 0.16);
  }
  #card.show, #ending.show { opacity: 1; }
  #ending.show { pointer-events: auto; }
  #ring {
    width: 62px; height: 62px; margin: 0 auto 8px; border-radius: 50%;
    background: conic-gradient(var(--cin) calc(var(--p, 0) * 1%), rgba(244,239,230,0.2) 0);
    -webkit-mask: radial-gradient(circle, transparent 57%, #000 59%);
    mask: radial-gradient(circle, transparent 57%, #000 59%);
  }
  #card h2 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 0.14em; }
  #cardLine { margin: 0.55em 0 0.7em; font-size: 14px; letter-spacing: 0.06em; color: var(--dim); }
  #card .how { margin: 0; font-size: 12px; letter-spacing: 0.16em; line-height: 1.9; }
  #ending {
    bottom: calc(8vh + env(safe-area-inset-bottom)); width: min(92vw, 440px);
    text-shadow: 0 2px 16px rgba(0,0,0,0.45);
  }
  #ending p { margin: 0.28em 0; font-size: clamp(16px, 2.1vh, 20px); letter-spacing: 0.08em; line-height: 1.75; }
  #again {
    margin-top: 1.15em; border-bottom: 1px solid rgba(244,239,230,0.45);
    letter-spacing: 0.24em; font-size: 14px; padding: 8px 2px 4px;
  }
  @media (max-aspect-ratio: 4/5) {
    #title h1 { font-size: clamp(84px, 12vh, 132px); }
    #meter { right: calc(10px + env(safe-area-inset-right)); top: 13vh; bottom: 16vh; }
    #hint { font-size: 13px; letter-spacing: 0.08em; }
  }
</style>
</head>
<body>
<canvas id="c" aria-label="放下。按住蓄力，松开飞出。"></canvas>
<div id="ui">
  <div id="bar">
    <div class="left">
      <button id="mute" type="button" aria-label="声音">声</button>
      <button id="lang" type="button">EN</button>
    </div>
    <div class="right"><button id="restart" type="button">重来</button></div>
  </div>
  <header id="title"><h1>放<span>下</span></h1><p id="sub">LET GO</p></header>
  <p id="hint"></p>
  <div id="meter" aria-hidden="true">
    <div class="track"></div>
    <div id="bestMark"></div>
    <div id="nowMark"><b id="alt"></b></div>
  </div>
  <section id="card">
    <div id="ring"></div>
    <h2 id="cardName"></h2>
    <p id="cardLine"></p>
    <p class="how"><span id="howHold"></span><br><span id="howTap"></span></p>
  </section>
  <section id="ending">
    <p id="e1"></p><p id="e2"></p><p id="e3"></p>
    <button id="again" type="button">再爬一次</button>
  </section>
</div>
<script src="game.js"></script>
<script>
"use strict";
const FX = window.Fangxia;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const ui = {
  title: document.getElementById("title"),
  sub: document.getElementById("sub"),
  hint: document.getElementById("hint"),
  mute: document.getElementById("mute"),
  lang: document.getElementById("lang"),
  restart: document.getElementById("restart"),
  card: document.getElementById("card"),
  ring: document.getElementById("ring"),
  cardName: document.getElementById("cardName"),
  cardLine: document.getElementById("cardLine"),
  howHold: document.getElementById("howHold"),
  howTap: document.getElementById("howTap"),
  ending: document.getElementById("ending"),
  e1: document.getElementById("e1"),
  e2: document.getElementById("e2"),
  e3: document.getElementById("e3"),
  again: document.getElementById("again"),
  alt: document.getElementById("alt"),
  now: document.getElementById("nowMark"),
  best: document.getElementById("bestMark"),
};
const shot = new URLSearchParams(location.search).has("shot");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const coarse = matchMedia("(pointer: coarse)").matches;
const SAVE_KEY = "fangxia-v1";
function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; } }
function writeSave(data) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) {} }
const saved = loadSave();
let lang = saved.lang === "en" ? "en" : "zh";
let muted = !!saved.mute;
let bestSaved = saved.best | 0;
const state = FX.createState();
let holding = false, restartPulse = false, rush = false, snap = false;
let viewScale = shot ? 1 : coarse ? 0.85 : 1;
const frameMs = [];
const cam = { y: 54, z: 0, ppm: 14, shake: 0 };

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function mix(a, b, t) { return a + (b - a) * t; }
function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
function damp(a, b, dt, k) { return a + (b - a) * (1 - Math.exp(-k * dt)); }
function css([r, g, b]) { return "rgb(" + (r | 0) + "," + (g | 0) + "," + (b | 0) + ")"; }
function mixc(a, b, t) { return [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)]; }
function cssa(c, a) {
  return "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + a + ")";
}
function hash(n) {
  const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function vnoise(x) {
  const i = Math.floor(x);
  const f = x - i;
  const u = f * f * (3 - 2 * f);
  return hash(i) * (1 - u) + hash(i + 1) * u;
}
function ridged(x) {
  let v = 0, a = 0.55, f = 1, sum = 0;
  for (let i = 0; i < 5; i++) {
    let n = vnoise(x * f);
    n = 1 - Math.abs(n * 2 - 1);
    n *= n;
    v += n * a;
    sum += a;
    f *= 2.07;
    a *= 0.5;
  }
  return sum ? v / sum : 0;
}
function mtn(u) {
  const w = ridged(u * 0.42 + 1.2) - 0.5;
  const a = ridged(u + w * 0.65);
  const b = ridged(u * 0.31 + 7.4);
  return Math.pow(a, 1.08) * 0.84 + Math.pow(b, 1.55) * 0.16;
}

const SKY = [
  { h: 0, top: [5, 8, 20], bot: [28, 44, 86], sun: [214, 224, 236] },
  { h: 18, top: [18, 16, 52], bot: [96, 52, 86], sun: [255, 186, 154] },
  { h: 36, top: [36, 46, 102], bot: [206, 98, 84], sun: [255, 206, 162] },
  { h: 58, top: [64, 110, 172], bot: [244, 156, 102], sun: [255, 226, 186] },
  { h: 82, top: [126, 174, 208], bot: [255, 198, 146], sun: [255, 242, 218] },
  { h: 108, top: [190, 216, 230], bot: [255, 226, 190], sun: [255, 250, 242] },
];
function skyAt(h) {
  let i = 0;
  while (i < SKY.length - 2 && h > SKY[i + 1].h) i++;
  const a = SKY[i], b = SKY[i + 1];
  const t = smooth(clamp((h - a.h) / (b.h - a.h), 0, 1));
  return { top: mixc(a.top, b.top, t), bot: mixc(a.bot, b.bot, t), sun: mixc(a.sun, b.sun, t) };
}

let W = 2, H = 2, portrait = false;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, coarse ? 1.5 : 2) * viewScale;
  const w = Math.max(2, Math.round(canvas.clientWidth * dpr));
  const h = Math.max(2, Math.round(canvas.clientHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  W = w; H = h;
  portrait = canvas.clientWidth / Math.max(1, canvas.clientHeight) < 0.92;
}
window.addEventListener("resize", resize);
resize();

let PX = 1, ALT = 0, anchorX = 0, ppm = 60;
let rimCol = [255, 214, 170];
let SKYNOW = { top: [8, 12, 24], bot: [24, 36, 64], sun: [255, 244, 230] };

const scarf = [];
for (let i = 0; i < 11; i++) scarf.push({ z: i * 0.11, y: 8.15, pz: i * 0.11, py: 8.15 });
const flakes = [];
for (let i = 0; i < 100; i++) {
  flakes.push({
    z: Math.random() * 40 - 10,
    y: Math.random() * 140,
    layer: i % 3,
    drift: 0.25 + Math.random() * 0.85,
  });
}
const grain = document.createElement("canvas");
grain.width = grain.height = 128;
{
  const g = grain.getContext("2d");
  const im = g.createImageData(128, 128);
  for (let i = 0; i < im.data.length; i += 4) {
    const v = Math.random() * 255;
    im.data[i] = im.data[i + 1] = im.data[i + 2] = v;
    im.data[i + 3] = Math.random() * 40;
  }
  g.putImageData(im, 0, 0);
}
let grainPat = null;
function makePuff(inner) {
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const g = c.getContext("2d");
  const rad = g.createRadialGradient(128, 132, 8, 128, 124, 126);
  rad.addColorStop(0, inner);
  rad.addColorStop(0.55, inner.replace("0.95", "0.35").replace("0.85", "0.28"));
  rad.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = rad;
  g.fillRect(0, 0, 256, 256);
  return c;
}
const puffLit = makePuff("rgba(255,252,248,0.95)");
const puffShade = makePuff("rgba(206,168,160,0.85)");

const LIP_Y = [];
for (let i = 0; i < FX.HOLDS.length; i++) {
  const k = FX.HOLDS[i].k;
  if (k !== "hold" && k !== "start") LIP_Y.push(FX.HOLDS[i].y);
}
function routeZ(y) {
  const hs = FX.HOLDS;
  if (y <= hs[0].y) return hs[0].z;
  const last = hs[hs.length - 1];
  if (y >= last.y) return last.z;
  let i = 0;
  while (i < hs.length - 2 && hs[i + 1].y < y) i++;
  const a = hs[i], b = hs[i + 1];
  return a.z + (b.z - a.z) * ((y - a.y) / (b.y - a.y || 1));
}
function bay(y, y0, half, depth) {
  const d = Math.abs(y - y0);
  return d >= half ? 0 : -depth * (1 - d / half);
}
function nose(y, y0, h, amp) {
  const d = y - y0;
  if (d < -h || d > h * 0.22) return 0;
  if (d >= -h * 0.08 && d <= h * 0.05) return amp;
  if (d < 0) return amp * (1 - (-d - h * 0.08) / (h * 0.92));
  return amp * (1 - (d - h * 0.05) / (h * 0.17));
}
function lipAmount(y) {
  let best = 0;
  for (let i = 0; i < LIP_Y.length; i++) {
    const d = LIP_Y[i] - y;
    if (d < 0 || d > 0.2) continue;
    const a = d < 0.11 ? 1 : 1 - (d - 0.11) / 0.09;
    if (a > best) best = a;
  }
  return best;
}
function wallOffset(y) {
  let z = -0.68;
  z += bay(y, 15, 2.1, 1.35);
  z += bay(y, 33, 1.7, 1.05);
  z += bay(y, 49, 2.3, 1.55);
  z += bay(y, 68, 1.8, 1.25);
  z += bay(y, 86, 2.2, 1.45);
  z += bay(y, 100, 1.5, 1.05);
  z += nose(y, 22, 1.15, 0.28);
  z += nose(y, 40, 1.25, 0.32);
  z += nose(y, 58, 1.05, 0.24);
  z += nose(y, 77, 1.3, 0.3);
  z += nose(y, 94, 1.1, 0.26);
  z += (hash(Math.floor(y * 3.1) + 4) - 0.58) * 0.16;
  const lip = lipAmount(y);
  if (lip > 0) z = Math.max(z, -0.5 + lip * 0.98);
  return z;
}
function wallZ(y) { return routeZ(y) + wallOffset(y); }
function toS(z, y) {
  return [anchorX + (z - cam.z) * ppm, H * 0.46 - (y - cam.y) * ppm];
}

let wallPts = [];
function buildWall() {
  wallPts = [];
  const yHi = cam.y + (H * 0.52 + 70) / ppm;
  const yLo = cam.y - (H * 0.58 + 70) / ppm;
  const step = Math.max(0.04, 3 * PX / ppm);
  for (let y = yHi; y >= yLo; y -= step) {
    const z = wallZ(y);
    const s = toS(z, y);
    const c = hash(Math.floor(y * 1.02) + 11);
    const f = hash(Math.floor(y * 4.4) + 29);
    let jitter = (c - 0.66) * 20 + (f - 0.62) * 5;
    if (jitter > 4) jitter = 4;
    wallPts.push({ y: y, z: z, x: s[0] + jitter * PX, sy: s[1] });
  }
}
function edgeAt(y) {
  if (!wallPts.length) {
    const z = wallZ(y);
    const s = toS(z, y);
    return { y: y, z: z, x: s[0], sy: s[1] };
  }
  let best = wallPts[0], bestD = Math.abs(best.y - y);
  for (let i = 1; i < wallPts.length; i++) {
    const d = Math.abs(wallPts[i].y - y);
    if (d < bestD) { bestD = d; best = wallPts[i]; }
  }
  return best;
}
function wallPath() {
  ctx.beginPath();
  for (let i = 0; i < wallPts.length; i++) ctx.lineTo(wallPts[i].x, wallPts[i].sy);
  ctx.lineTo(-60, H + 80);
  ctx.lineTo(-60, -80);
  ctx.closePath();
}
function traceEdge() {
  ctx.beginPath();
  ctx.moveTo(wallPts[0].x, wallPts[0].sy);
  for (let i = 1; i < wallPts.length; i++) ctx.lineTo(wallPts[i].x, wallPts[i].sy);
}

function drawSky() {
  const sky = SKYNOW;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, css(sky.top));
  g.addColorStop(0.4, css(mixc(sky.top, sky.bot, 0.3)));
  g.addColorStop(0.7, css(mixc(sky.top, sky.bot, 0.66)));
  g.addColorStop(1, css(sky.bot));
  ctx.fillStyle = g;
  ctx.fillRect(-30, -30, W + 60, H + 60);
  const star = 1 - smooth(clamp((ALT - 6) / 32, 0, 1));
  if (star > 0.04) {
    ctx.fillStyle = "#f7f4ee";
    for (let i = 0; i < 58; i++) {
      ctx.globalAlpha = star * (0.3 + hash(i * 4.4) * 0.7);
      const s = (hash(i * 1.7) > 0.9 ? 2.1 : 1.15) * PX;
      ctx.fillRect(hash(i * 3.17) * W, hash(i * 8.91) * H * 0.75, s, s);
    }
    ctx.globalAlpha = 1;
  }
  const rise = smooth(clamp((ALT - 8) / 96, 0, 1));
  const sx = W * (portrait ? 0.64 : 0.73);
  const sy = H * (0.5 - rise * 0.3);
  const sunR = mix(portrait ? 15 : 20, portrait ? 34 : 52, rise) * PX;
  let glow = ctx.createRadialGradient(sx, sy, sunR * 0.15, sx, sy, sunR * 7);
  glow.addColorStop(0, cssa(sky.sun, 0.5));
  glow.addColorStop(0.16, cssa(sky.sun, 0.2));
  glow.addColorStop(0.42, cssa(sky.bot, 0.07));
  glow.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(sx, sy, sunR * 7, 0, Math.PI * 2);
  ctx.fill();
  glow = ctx.createRadialGradient(sx, sy, sunR * 0.2, sx, sy, sunR * 2.6);
  glow.addColorStop(0, cssa(sky.sun, 0.95));
  glow.addColorStop(0.4, cssa(sky.sun, 0.28));
  glow.addColorStop(1, cssa(sky.sun, 0));
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(sx, sy, sunR * 2.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(sx, sy, sunR, 0, Math.PI * 2);
  ctx.fillStyle = css(sky.sun);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(sx, sy, sunR * 0.52, 0, Math.PI * 2);
  ctx.fillStyle = "#fffaf2";
  ctx.fill();
  ctx.globalAlpha = 0.1;
  for (let i = 0; i < 4; i++) {
    const x = ((hash(i + 2) * 1.3 - 0.15) * W + state.time * 5 * PX) % (W + 240) - 120;
    const y = hash(i * 5 + 1) * H * 0.26 + 8 * PX;
    ctx.drawImage(puffLit, x, y, W * (0.26 + hash(i) * 0.18), 14 * PX);
  }
  ctx.globalAlpha = 1;
}

const RANGES = [
  { p: 0.05, base: 0.6, amp: 0.17, cycles: 2.6, seed: 1.4, depth: 0.18 },
  { p: 0.09, base: 0.67, amp: 0.2, cycles: 3.1, seed: 7.2, depth: 0.34 },
  { p: 0.14, base: 0.74, amp: 0.2, cycles: 3.6, seed: 14.5, depth: 0.5 },
  { p: 0.2, base: 0.81, amp: 0.17, cycles: 4.2, seed: 23.0, depth: 0.66 },
  { p: 0.28, base: 0.88, amp: 0.14, cycles: 4.8, seed: 33.4, depth: 0.8 },
  { p: 0.36, base: 0.95, amp: 0.11, cycles: 5.4, seed: 46.1, depth: 0.94 },
];
function rockColor(depth) {
  const t = smooth(clamp((ALT - 8) / 78, 0, 1));
  const far = mixc([22, 30, 52], [176, 132, 118], t);
  const near = mixc([8, 10, 18], [64, 36, 34], t);
  return mixc(far, near, Math.pow(depth, 0.8));
}
function drawRanges() {
  const step = Math.max(4, 5.5 * PX);
  const climb = clamp((cam.y - 16) / 92, 0, 1);
  ctx.lineJoin = "miter";
  ctx.miterLimit = 2;
  for (let li = 0; li < RANGES.length; li++) {

  leg(P(0.4, -0.04), P(0.68, 0.02 + kick), P(0.98, -0.06 + kick), P(1.07, -0.1 + kick * 0.6), 0.12, 0.09);
  leg(P(0.42, 0.08), P(0.7, 0.2 + kick2), P(1.0, 0.1 + kick2), P(1.09, 0.05 + kick2), 0.11, 0.085);
  fillPoly([
    P(-0.4, 0.0),
    P(-0.3, -0.11),
    P(-0.16, -0.15),
    P(-0.02, -0.06),
    P(0.14, -0.1),
    P(0.38, -0.02),
    P(0.44, 0.1),
    P(0.58, 0.12 + bulk * 0.15),
    P(0.5 + w01 * 0.12, 0.16 + bulk),
    P(0.08, 0.14 + bulk),
    P(-0.08, 0.08 + bulk * 0.72),
    P(-0.24, 0.13),
  ], INK, true);
  limb(P(0.08, 0.06 + bulk * 0.15), P(0.08, 0.16 + bulk), 0.016, 0.016, "#c6b59e", false);
  limb(P(0.32, 0.08 + bulk * 0.1), P(0.32, 0.16 + bulk), 0.016, 0.016, "#c6b59e", false);
  const kinds = [];
  if (state.mask & FX.ITEMS.trophy.bit) kinds.push("trophy");
  if (state.mask & FX.ITEMS.letter.bit) kinds.push("letter");
  if (state.mask & FX.ITEMS.ring.bit) kinds.push("ring");
  if (state.mask & FX.ITEMS.photo.bit) kinds.push("photo");
  const slot = (0.34 + w01 * 0.2) / (kinds.length + 0.4);
  for (let i = 0; i < kinds.length; i++) {
    drawItem(kinds[i], 0.1 + i * slot * 0.85, 0.12 + bulk * 0.42, Math.min(0.11, 0.08 + bulk * 0.12), P);
  }
  let nearHand;
  if (standing) nearHand = P(0.5, -0.16);
  else if (!state.attached) nearHand = P(-0.55, -0.08);
  else nearHand = [hold.z + 0.02, hold.y + 0.05];
  arm(P(0.02, 0.04), nearHand, -1.15);
  const neck = P(-0.02, 0.04);
  stepScarf(dt || 0.016, neck[0], neck[1]);
  drawRibbon(scarf, 3.3 * PX, 0.55 * PX, "#e14b3e");
}

function drawDrop() {
  if (state.dropT < 0 || !state.dropKind) return;
  const p = toS(state.dropZ, state.dropY);
  ctx.save();
  ctx.translate(p[0], p[1]);
  ctx.rotate(state.dropT * 4.5);
  ctx.globalAlpha = clamp(1 - Math.max(0, state.dropT - 0.65) / 0.55, 0, 1);
  const s = 13 * PX;
  ctx.fillStyle = state.dropKind === "trophy" ? "#e6b34d" : state.dropKind === "ring" ? "#f0d48a" : state.dropKind === "photo" ? "#d7dee8" : "#f4efe4";
  if (state.dropKind === "ring") {
    ctx.beginPath();
    ctx.lineWidth = 2 * PX;
    ctx.strokeStyle = "#f0d48a";
    ctx.arc(0, 0, s * 0.38, 0, Math.PI * 2);
    ctx.stroke();
  } else {
    ctx.fillRect(-s * 0.35, -s * 0.45, s * 0.7, s * 0.9);
  }
  ctx.restore();
}
function drawBurst() {
  if (state.burst < 0.04) return;
  const h = FX.HOLDS[state.holdIndex];
  if (!h) return;
  const p = toS(h.z, h.y);
  ctx.save();
  ctx.globalAlpha = state.burst * 0.4;
  ctx.strokeStyle = "#f6f1e8";
  ctx.lineWidth = 1.2 * PX;
  ctx.beginPath();
  ctx.arc(p[0], p[1], (1 - state.burst) * 22 * PX + 5 * PX, -0.8, 0.9);
  ctx.stroke();
  ctx.restore();
}
function drawSnow(dt) {
  const rush = clamp((Math.hypot(state.vz, state.vy) - 3) / 16, 0, 1);
  for (let i = 0; i < flakes.length; i++) {
    const f = flakes[i];
    const sp = 1 + f.layer * 0.7;
    f.z += f.drift * dt * sp * (1.1 + rush * 1.4);
    f.y -= dt * (0.65 + f.layer * 0.75) * (1 + rush * 0.8);
    if (f.y < cam.y - 28) f.y += 58;
    if (f.z > cam.z + 26) f.z -= 40;
    if (f.z < cam.z - 18) f.z += 40;
    const p = toS(f.z, f.y);
    if (p[0] < -24 || p[0] > W + 24 || p[1] < -24 || p[1] > H + 24) continue;
    ctx.globalAlpha = 0.16 + f.layer * 0.18;
    ctx.fillStyle = "#f7f4ee";
    ctx.strokeStyle = "#f7f4ee";
    if (f.layer < 2) {
      const s = (f.layer === 0 ? 1.15 : 1.7) * PX;
      ctx.fillRect(p[0], p[1], s, s);
    } else {
      ctx.lineWidth = 1.15 * PX;
      ctx.beginPath();
      ctx.moveTo(p[0], p[1]);
      ctx.lineTo(p[0] + (4.5 + rush * 12) * PX, p[1] + PX);
      ctx.stroke();
    }
  }
  const streaks = 8;
  ctx.lineCap = "round";
  for (let i = 0; i < streaks; i++) {
    const speed = (16 + i * 4) * (1 + rush * 1.6);
    const x = ((state.time * speed * 14 + i * 211) % (W + 180)) - 90;
    const y = (i * 113 + Math.floor(cam.y) * 5) % (H + 40) - 20;
    ctx.globalAlpha = 0.045 + rush * 0.1 + (ALT > 72 ? 0.04 : 0);
    ctx.strokeStyle = "#f4efe6";
    ctx.lineWidth = PX;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + (22 + i * 7 + rush * 36) * PX, y + 1.4 * PX);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function drawGrade() {
  if (state.mode === "impact") {
    ctx.globalAlpha = clamp(1 - state.impactT / 0.28, 0, 1) * 0.28;
    ctx.fillStyle = "#fff6ee";
    ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.globalAlpha = 1;
  }
  ctx.save();
  ctx.globalCompositeOperation = "soft-light";
  const cg = ctx.createLinearGradient(0, 0, 0, H);
  cg.addColorStop(0, "rgba(36, 58, 120, 0.2)");
  cg.addColorStop(0.5, "rgba(255, 236, 220, 0.05)");
  cg.addColorStop(1, "rgba(255, 168, 110, 0.14)");
  ctx.fillStyle = cg;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
  const v = ctx.createRadialGradient(W * 0.48, H * 0.42, H * 0.2, W * 0.5, H * 0.5, H * 0.78);
  v.addColorStop(0, "rgba(0,0,0,0)");
  v.addColorStop(1, "rgba(0,0,0,0.46)");
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
  if (!grainPat) grainPat = ctx.createPattern(grain, "repeat");
  ctx.save();
  ctx.globalAlpha = 0.14;
  ctx.fillStyle = grainPat;
  ctx.translate((state.time * 13) % 48, (state.time * 9) % 48);
  ctx.fillRect(-64, -64, W + 128, H + 128);
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
}

function render(dt) {
  resize();
  PX = W / Math.max(1, canvas.clientWidth);
  const dtS = dt || 0.016;
  const fall = clamp((-state.vy - 4) / 18, 0, 1);
  const endK = state.mode === "ending" ? 0.9 : 1;
  const playPpm = (portrait ? 76 : 90) * PX * mix(1, 0.72, fall) * endK;
  const widePpm = (portrait ? 12.6 : 14.6) * PX;
  const tIntro = smooth(1 - state.intro);
  let lead = portrait ? 0.55 : 0.85;
  if (state.mode === "ending") lead = portrait ? 1.15 : 1.45;
  else lead = mix(lead, 0.15, fall);
  const anchorY = state.attached ? FX.HOLDS[state.holdIndex].y : state.y;
  const playY = anchorY + lead;
  const wideY = 56;
  const dampK = reduce ? 8 : mix(3.2, 7.5, fall);
  const zLead = state.attached ? Math.sin(state.visAngle || 0) * 0.35 : clamp(state.vz * 0.05, -0.6, 0.6);
  if (snap) {
    cam.y = state.intro > 0.2 ? wideY : playY;
    cam.z = state.z + (state.intro > 0.2 ? 0 : zLead);
    cam.ppm = state.intro > 0.2 ? widePpm : playPpm;
    snap = false;
  } else {
    cam.y = damp(cam.y, mix(wideY, playY, tIntro), dtS, dampK);
    cam.z = damp(cam.z, state.z + zLead, dtS, 3.6);
    cam.ppm = damp(cam.ppm, mix(widePpm, playPpm, tIntro), dtS, 2.3);
  }
  ALT = cam.y;
  SKYNOW = skyAt(ALT);
  rimCol = mixc([188, 198, 214], [255, 206, 154], smooth(clamp((ALT - 12) / 50, 0, 1)));
  ppm = cam.ppm;
  anchorX = W * (portrait ? 0.4 : 0.28);
  const mag = reduce ? 0 : state.shake * 14 * PX;
  ctx.setTransform(1, 0, 0, 1, Math.sin(state.time * 53) * mag, Math.cos(state.time * 47) * mag * 0.65);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
  ctx.clearRect(-80, -80, W + 160, H + 160);
  drawSky();
  drawRanges();
  drawClouds();
  buildWall();
  drawWall();
  drawShelves();
  drawHolds();
  drawArc();
  drawClimber(dtS);
  drawDrop();
  drawBurst();
  drawSnow(dtS);
  drawGrade();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

const audio = { ctx: null, master: null, wind: null, drone: null, filter: null, nextNote: 0 };
function audioStart() {
  if (audio.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const actx = new AC();
  audio.ctx = actx;
  const master = actx.createGain();
  master.gain.value = muted ? 0 : 0.85;
  master.connect(actx.destination);
  audio.master = master;
  const buf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
  const data = buf.getChannelData(0);
  let b = 0;
  for (let i = 0; i < data.length; i++) { b = b * 0.985 + (Math.random() * 2 - 1) * 0.015; data[i] = b * 6.5; }
  const src = actx.createBufferSource();
  src.buffer = buf; src.loop = true;
  const filter = actx.createBiquadFilter();
  filter.type = "lowpass"; filter.frequency.value = 620;
  const wind = actx.createGain(); wind.gain.value = 0;
  src.connect(filter).connect(wind).connect(master);
  src.start();
  audio.wind = wind; audio.filter = filter;
  const o1 = actx.createOscillator(), o2 = actx.createOscillator(), g = actx.createGain();
  o1.type = o2.type = "sine";
  o1.frequency.value = 98; o2.frequency.value = 146.8; g.gain.value = 0;
  o1.connect(g); o2.connect(g); g.connect(master);
  o1.start(); o2.start();
  audio.drone = { o1, o2, g };
}
function setMuted(v) {
  muted = v;
  if (audio.master) audio.master.gain.value = muted ? 0 : 0.85;
  writeSave({ best: bestSaved, mute: muted, lang });
  ui.mute.classList.toggle("off", muted);
}
function tone(freq, dur, type, vol, slide) {
  if (!audio.ctx || muted) return;
  const t = audio.ctx.currentTime;
  const o = audio.ctx.createOscillator();
  const gn = audio.ctx.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t + dur);
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.02);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gn).connect(audio.master);
  o.start(t); o.stop(t + dur + 0.03);
}
function noiseBurst(dur, vol, from, to) {
  if (!audio.ctx || muted) return;
  const actx = audio.ctx;
  const n = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, n, actx.sampleRate);
  const d = buf.getChannelData(0);
  let b = 0;
  for (let i = 0; i < n; i++) { b = b * 0.6 + (Math.random() * 2 - 1) * 0.4; d[i] = b; }
  const src = actx.createBufferSource();
  src.buffer = buf;
  const f = actx.createBiquadFilter();
  f.type = "bandpass";
  const t = actx.currentTime;
  f.frequency.setValueAtTime(from, t);
  f.frequency.exponentialRampToValueAtTime(to, t + dur);
  const gn = actx.createGain();
  gn.gain.setValueAtTime(vol, t);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(gn).connect(audio.master);
  src.start(t); src.stop(t + dur + 0.02);
}
const SCALE = [196, 220, 247, 294, 330, 392, 440, 494];
function playSfx(list) {
  for (const s of list) {
    if (s === "release") noiseBurst(0.28, 0.08, 900, 220);
    else if (s === "catch") { tone(174.6, 0.22, "sine", 0.05); tone(349.2, 0.4, "triangle", 0.035); }
    else if (s === "arm") tone(740, 0.05, "sine", 0.02);
    else if (s === "near") tone(880, 0.35, "sine", 0.03, 420);
    else if (s === "drop") { tone(523.25, 1.4, "sine", 0.06); tone(784, 1.6, "triangle", 0.03); }
    else if (s === "summit") { tone(392, 1.2, "sine", 0.05); tone(494, 1.5, "sine", 0.04); tone(587, 1.8, "triangle", 0.035); }
    else if (s === "impact") noiseBurst(0.4, 0.12, 180, 60);
    else if (s === "ledge") tone(311, 0.4, "sine", 0.03);
  }
}
function music(alt, mode) {
  if (!audio.ctx || muted || !audio.drone) return;
  const sp = Math.hypot(state.vz, state.vy);
  audio.wind.gain.setTargetAtTime(clamp(0.035 + sp * 0.004 + (mode === "impact" ? 0.08 : 0), 0, 0.2), audio.ctx.currentTime, 0.15);
  audio.filter.frequency.setTargetAtTime(420 + sp * 18, audio.ctx.currentTime, 0.2);
  const climb = clamp((alt - 6) / 100, 0, 1);
  audio.drone.o1.frequency.setTargetAtTime(mix(82, 130.8, climb), audio.ctx.currentTime, 0.4);
  audio.drone.g.gain.setTargetAtTime(mode === "ending" ? 0.03 : 0.012, audio.ctx.currentTime, 0.5);
  if (state.time > audio.nextNote && mode === "play") {
    tone(SCALE[(Math.floor(alt / 9) + Math.floor(state.time * 0.2)) % SCALE.length], 1.6, "triangle", 0.02);
    audio.nextNote = state.time + 2.6 + (Math.sin(state.time * 0.3) * 0.5 + 0.5) * 1.8;
  }
}

function ttext(zh, en) { return lang === "en" ? en : zh; }
function syncUI() {
  const U = FX.UI;
  ui.lang.textContent = lang === "en" ? "中" : "EN";
  ui.restart.textContent = ttext(U.restartZh, U.restartEn);
  ui.again.textContent = ttext(U.againZh, U.againEn);
  ui.mute.classList.toggle("off", muted);
  const titleA = smooth(clamp((state.time - 0.35) / 0.7, 0, 1)) * smooth(clamp((state.intro - 0.08) / 0.55, 0, 1));
  ui.title.style.opacity = String(state.mode === "ending" ? 0 : titleA);
  const early = state.catches < 4 && state.mode === "play";
  ui.hint.textContent = state.failedOnce && !state.airCatch ? ttext(U.hintFallZh, U.hintFallEn) : ttext(U.hintZh, U.hintEn);
  ui.hint.style.opacity = early ? String(smooth(clamp((state.time - 1.4) / 0.5, 0, 1)) * (state.mode === "play" ? 1 : 0)) : "0";
  if (state.mode !== "play") ui.hint.style.opacity = "0";
  const alt = state.attached ? FX.HOLDS[state.holdIndex].y : state.y;
  ui.now.style.bottom = clamp(alt / FX.SUMMIT_Y, 0, 1) * 100 + "%";
  ui.alt.textContent = Math.max(0, Math.round(alt)) + (lang === "zh" ? "米" : "m");
  ui.best.style.bottom = clamp(bestSaved / FX.SUMMIT_Y, 0, 1) * 100 + "%";
  ui.best.style.opacity = bestSaved > 8 ? "0.9" : "0";
  const showCard = state.mode === "ledge" || state.mode === "drop";
  ui.card.classList.toggle("show", showCard);
  if (showCard) {
    const spec = FX.ITEMS[FX.HOLDS[state.holdIndex].k];
    if (spec) {
      ui.cardName.textContent = ttext(spec.zh, spec.en);
      ui.cardLine.textContent = ttext(spec.lineZh, spec.lineEn);
    }
    ui.howHold.textContent = ttext(U.holdZh, U.holdEn);
    ui.howTap.textContent = ttext(U.tapZh, U.tapEn);
    ui.ring.style.setProperty("--p", String((state.mode === "ledge" ? clamp(state.pressT / 0.62, 0, 1) : 1) * 100));
  }
  const showEnd = state.mode === "ending" && state.endingT > 0.8;
  ui.ending.classList.toggle("show", showEnd);
  if (state.mode === "ending") {
    const lines = (FX.ENDINGS[state.mask] || FX.ENDINGS[15])[lang === "en" ? "en" : "zh"];
    ui.e1.textContent = lines[0];
    ui.e2.textContent = lines[1];
    ui.e3.textContent = lines[2];
  }
  ui.restart.style.visibility = state.mode === "ending" ? "hidden" : "visible";
}

let acc = 0, last = 0, frames = 0, readySent = false;
let readyResolve;
const ready = new Promise((r) => { readyResolve = r; });
function frame(now) {
  try {
    if (!last) last = now;
    const raw = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    frameMs.push(raw);
    if (frameMs.length > 40) frameMs.shift();
    frames++;
    if (!shot && frames % 40 === 0 && frameMs.length > 20) {
      const avg = frameMs.reduce((a, b) => a + b, 0) / frameMs.length;
      if (avg > 0.02 && viewScale > 0.6) viewScale = Math.max(0.6, viewScale * 0.9);
      else if (avg < 0.012 && viewScale < 1) viewScale = Math.min(1, viewScale * 1.04);
    }
    acc += raw;
    const sounds = [];
    const input = { holding, restart: restartPulse, skipIntro: rush || reduce };
    restartPulse = false;
    let n = 0;
    while (acc >= 1 / 120 && n < 8) {
      FX.step(state, 1 / 120, input);
      if (state.sfx) sounds.push.apply(sounds, state.sfx);
      acc -= 1 / 120;
      n++;
      input.restart = false;
    }
    const peak = Math.round(state.bestRun);
    if (peak > bestSaved) {
      bestSaved = peak;
      writeSave({ best: bestSaved, mute: muted, lang });
      tone(587, 0.3, "sine", 0.03);
    }
    playSfx(sounds);
    music(state.attached ? FX.HOLDS[state.holdIndex].y : state.y, state.mode);
    render(raw);
    syncUI();
    if (!readySent && state.time > 0.05) { readySent = true; readyResolve(true); }
  } catch (err) {
    console.error(err);
    if (!readySent) { readySent = true; readyResolve(false); }
  }
  requestAnimationFrame(frame);
}
function unlock() {
  audioStart();
  if (audio.ctx && audio.ctx.state === "suspended") audio.ctx.resume();
}
document.addEventListener("pointerdown", (e) => {
  unlock();
  if (e.target.closest && e.target.closest("button")) return;
  holding = true; rush = true;
}, { passive: false });
document.addEventListener("pointerup", () => { holding = false; });
document.addEventListener("pointercancel", () => { holding = false; });
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); if (!e.repeat) { holding = true; rush = true; unlock(); } }
  else if (e.code === "KeyR") restartPulse = true;
  else if (e.code === "KeyM") setMuted(!muted);
  else if (e.code === "KeyL") toggleLang();
});
document.addEventListener("keyup", (e) => { if (e.code === "Space") holding = false; });
function toggleLang() {
  lang = lang === "zh" ? "en" : "zh";
  writeSave({ best: bestSaved, mute: muted, lang });
  syncUI();
}
ui.mute.addEventListener("click", () => setMuted(!muted));
ui.lang.addEventListener("click", toggleLang);
function fullRestart() { restartPulse = true; rush = true; unlock(); }
ui.restart.addEventListener("click", fullRestart);
ui.again.addEventListener("click", fullRestart);
setMuted(muted);
syncUI();
requestAnimationFrame(frame);

window.__fx = {
  ready,
  state() {
    return {
      mode: state.mode, y: state.y, z: state.z, mask: state.mask, hold: state.holdIndex,
      catches: state.catches, falls: state.falls, intro: state.intro, attached: state.attached,
      endingT: state.endingT, time: state.time,
    };
  },
  teleport(i) {
    const h = FX.HOLDS[i];
    state.holdIndex = i; state.attached = true; state.mode = "play";
    state.settle = 1; state.holdT = 0; state.intro = 0;
    state.vy = state.vz = state.angle = state.visAngle = 0;
    state.y = h.y - FX.L; state.z = h.z; state.origin = i;
    state.flightT = 0; state.dots = []; state.catches = 6; state.launches = 4;
    snap = true;
  },
  mask(m) { state.mask = m; },
  fallFrom(i) {
    this.teleport(i);
    const h = FX.HOLDS[i];
    state.attached = false; state.mode = "play";
    state.vy = -18; state.vz = 0.8;
    state.y = h.y - 5; state.z = h.z + 0.8;
    state.flightT = 0.6; state.origin = i;
    state.angle = Math.atan2(-state.vz, state.vy);
    state.visAngle = state.angle;
    snap = true;
  },
  ending(mask) {
    this.teleport(FX.HOLDS.length - 1);
    state.mask = mask; state.mode = "ending"; state.endingT = 2.4;
    const h = FX.HOLDS[state.holdIndex];
    state.y = h.y + 0.22; state.z = h.z;
    snap = true;
  },
};
