<body>
<canvas id="c" tabindex="0" aria-label="放下。按住空格蓄力，松开发力。"></canvas>
<div id="ui">

<script>
"use strict";
const FX = window.Fangxia;
const canvas = document.getElementById("c");
let live = true, glContext = null;
try {
  FXRender.init(canvas);
  glContext = canvas.getContext("webgl2") || canvas.getContext("webgl");
}
catch (e) {
  live = false;
  document.body.insertAdjacentHTML("beforeend", "<p style='position:fixed;inset:0;display:flex;align-items:center;justify-content:center'>需要 WebGL</p>");
}
const ui = {
  prologue: document.getElementById("prologue"),
  hint: document.getElementById("hint"),
  whisper: document.getElementById("whisper"),
  back: document.getElementById("backHint"),
  mute: document.getElementById("mute"),
  restart: document.getElementById("restart"),
  pack: document.getElementById("pack"),
  packItems: document.getElementById("packItems"),
  packKeep: document.getElementById("packKeep"),
  ending: document.getElementById("ending"),
  passage: document.getElementById("passage"),
  again: document.getElementById("again"),
  retrieve: document.getElementById("retrieve"),
  alt: document.getElementById("alt"),
  now: document.getElementById("nowMark"),
  best: document.getElementById("bestMark"),
  marks: document.getElementById("marks"),
  resume: document.getElementById("resume"),
  resumePlay: document.getElementById("resumePlay"),
};
const shotName = new URLSearchParams(location.search).get("shot") || "";
const shot = !!shotName;
const SAVE_KEY = "fangxia-v1";
function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; } }
function writeSave(data) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) {} }
const saved = loadSave();
let found = saved.found | 0;
let muted = !!saved.mute;
let bestEver = saved.best || 8;
function persist() { writeSave({ found: found, mute: muted, best: bestEver, lang: "zh" }); }
ui.mute.classList.toggle("off", muted);
ui.mute.textContent = muted ? "静" : "声";
FX.PROLOGUE.forEach(function (line) {
  const p = document.createElement("p");
  p.textContent = line;
  ui.prologue.appendChild(p);
});
for (let i = 0; i < 16; i++) {
  const s = document.createElement("span");
  if (found & (1 << i)) s.className = "on";
  ui.marks.appendChild(s);
}
const coarse = matchMedia("(pointer: coarse)").matches;
let quality = coarse || innerWidth < innerHeight ? 1 : 2;
if (live) FXRender.setQuality(quality);
let camY = 12, focusZ = 0;
const state = FX.createState();
let holding = false;
let wantKeep = false, wantDrop = "", wantRetrieve = false, restartPulse = false;
let acc = 0, last = 0;
let backT = -1, backWait = true;
let prologueLeft = shot ? 0 : 7.2;
let slowSeconds = 0;
let flash = 0;
let activePointer = null, keyHeld = false;
let contextLost = false, pausedNeedsRender = false;
let paused = false, sessionClock = 0, packSignature = "", sessionActive = false;
const SESSION_KEY = "fangxia-session-v2";
const routeVersion = FX.HOLDS.map(function (h) { return [h.y, h.z, h.k].join(":"); }).join("|");
function cancelCharge() {
  if (activePointer !== null && canvas.hasPointerCapture(activePointer)) canvas.releasePointerCapture(activePointer);
  holding = false; keyHeld = false; activePointer = null;
  state.holding = false; state.prevHolding = false; state.holdT = 0;
  state.armed = false; state.dots = [];
  wantKeep = false; wantDrop = ""; wantRetrieve = false;
}
function saveSession() {
  if (shot || restartPulse) return;
  try {
    sessionActive = sessionActive || state.launches > 0 || state.holdIndex > 0 || state.mask !== 15 || state.lost.length > 0 || state.mode !== "play";
    if (!sessionActive) { localStorage.removeItem(SESSION_KEY); return; }
    const snapshot = Object.assign({}, state, { dots: [], sfx: [], holding: false, prevHolding: false, holdT: 0, armed: false });
    localStorage.setItem(SESSION_KEY, JSON.stringify({ route: routeVersion, state: snapshot }));
  } catch (e) {}
}
function restoreSession() {
  if (shot) return false;
  try {
    const entry = JSON.parse(localStorage.getItem(SESSION_KEY));
    if (!entry || entry.route !== routeVersion || !entry.state) return false;
    const v = entry.state;
    if (!["play", "ledge", "drop", "ending", "impact"].includes(v.mode) || !Number.isInteger(v.holdIndex) || v.holdIndex < 0 || v.holdIndex >= FX.HOLDS.length || !Number.isInteger(v.origin) || v.origin < 0 || v.origin >= FX.HOLDS.length || !Number.isInteger(v.mask) || v.mask < 0 || v.mask > 15 || !Array.isArray(v.lost)) return false;
    for (const key of Object.keys(state)) {
      const initial = state[key];
      if (typeof initial === "number" && !Number.isFinite(v[key])) return false;
      if ((typeof initial === "boolean" || typeof initial === "string") && typeof v[key] !== typeof initial) return false;
      if (Array.isArray(initial) && !Array.isArray(v[key])) return false;
    }
    let lostMask = 0;
    if (v.lost.length > 4 || !v.lost.every(function (item) {
      const spec = item && FX.ITEMS[item.kind];
      if (!spec || item.bit !== spec.bit || (lostMask & spec.bit) || (v.mask & spec.bit) || !Number.isFinite(item.y) || !Number.isFinite(item.z) || !Number.isInteger(item.hold) || item.hold < 0 || item.hold >= FX.HOLDS.length) return false;
      lostMask |= spec.bit;
      return true;
    }) || (v.mask | lostMask) !== 15) return false;
    for (const key of Object.keys(state)) state[key] = v[key];
    sessionActive = true;
    state.intro = 0; state.seenRelease = true;
    cancelCharge();
    prologueLeft = 0; camY = state.y + 0.9; focusZ = state.z;
    return true;
  } catch (e) { return false; }
}
function setPaused(value) {
  if (shot || (!value && contextLost)) return;
  paused = value; pausedNeedsRender = value;
  cancelCharge(); acc = 0; last = 0; slowSeconds = 0;
  document.body.classList.toggle("paused", value);
  ui.resume.classList.toggle("show", value);
  if (value) { persist(); saveSession(); if (ac) ac.suspend().catch(function () {}); }
  else { if (ac && !muted) ac.resume().catch(function () {}); }
}
const restoredSession = restoreSession();

function renderRatio() {
  if (quality === 0) return 0.7;
  return Math.min(innerWidth < innerHeight ? 1.15 : 1.35, devicePixelRatio || 1);
}
function resize() {
  if (!live) return;
  FXRender.resize(innerWidth, innerHeight, renderRatio());
  if (paused) pausedNeedsRender = true;
}
addEventListener("resize", resize);

function clamp01(v) { return Math.max(0, Math.min(1, v)); }
function holdNear(y) {
  let best = 0, bd = 1e9;
  for (let i = 0; i < FX.HOLDS.length; i++) {
    const d = Math.abs(FX.HOLDS[i].y - y);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

let ac = null, gustOn = false;
function ensureAudio() {
  if (ac || muted) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ac = new AC();
  const n = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const d = n.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource();
  src.buffer = n; src.loop = true;
  const f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = 400;
  const g = ac.createGain(); g.gain.value = 0.0;
  const master = ac.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ac.destination);
  src.connect(f); f.connect(g); g.connect(master);
  ac._master = master;
  src.start();
  ac._wind = g; ac._filt = f;
}
function gustAudio(fc) {
  if (muted || paused || !ac) return;
  const amp = Math.min(0.08, 0.004 + Math.abs(fc.now) * 0.02 + Math.abs(fc.soon) * 0.012);
  ac._wind.gain.setTargetAtTime(amp, ac.currentTime, 0.2);
  ac._filt.frequency.setTargetAtTime(280 + Math.abs(fc.soon) * 500, ac.currentTime, 0.3);
  const coming = Math.abs(fc.soon) > Math.abs(fc.now) + 0.25 && Math.abs(fc.soon) > 0.45;
  if (coming && !gustOn) {
    gustOn = true;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(90, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(220, ac.currentTime + 0.7);
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.04, ac.currentTime + 0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.95);
    o.connect(g); g.connect(ac._master);
    o.start(); o.stop(ac.currentTime + 1);
  }
  if (!coming) gustOn = false;
}
function tone(freq, dur, type, gain) {
  if (!ac || muted) return;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type || "sine";
  o.frequency.value = freq;
  g.gain.setValueAtTime(gain || 0.05, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g); g.connect(ac._master);
  o.start(); o.stop(ac.currentTime + dur);
}
function playSfx(list) {
  if (!list || !list.length || muted || paused) return;
  if (!ac) return;
  list.forEach(function (s) {
    if (s === "catch" || s === "land") tone(s === "land" ? 90 : 180, 0.12, "sine", 0.06);
    else if (s === "release") tone(240, 0.08, "triangle", 0.04);
    else if (s === "arm") tone(520, 0.06, "sine", 0.03);
    else if (s === "impact") tone(50, 0.3, "sawtooth", 0.07);
    else if (s === "summit") tone(330, 0.5, "sine", 0.05);
    else if (s === "slip") tone(140, 0.15, "triangle", 0.04);
  });
}

function syncUI(dt) {
  const dropped = state.lost && state.lost.length;
  if (!state.crown) { backT = -1; backWait = true; }
  else if (backWait && dropped && state.attached) { backT = 0; backWait = false; }
  if (backT >= 0) {
    if (holding && backT > 0.18) backT = -1;
    else { backT += dt; if (backT > 3.4) backT = -1; }
  }
  ui.back.style.opacity = state.mode !== "ending" && backT > 0.2 && backT < 3.2 ? "0.86" : "0";
  if (backT > 0) {
    ui.back.style.left = "16%";
    ui.back.style.top = (innerHeight * 0.4) + "px";
    ui.back.style.transform = "none";
  }
  if (!shot && prologueLeft > 0) {
    prologueLeft -= dt;
    ui.prologue.classList.add("show");
    if (holding) prologueLeft = Math.min(prologueLeft, 0.4);
  } else ui.prologue.classList.remove("show");
  ui.hint.style.opacity = state.catches < 2 && state.mode === "play" && !paused ? "0.8" : "0";
  ui.hint.textContent = state.attached ? "按住蓄力，弧线碰到岩点再松开" : "下坠时按住，伸手抓住岩点";
  const showPack = state.mode === "ledge";

  const signature = showPack ? String(state.mask) : "";
  if (showPack && signature !== packSignature) {
    ui.packItems.replaceChildren();
    FX.ORDER.forEach(function (k) {
      const spec = FX.ITEMS[k];
      if (!(state.mask & spec.bit)) return;
      const b = document.createElement("button");
      b.className = "mem"; b.type = "button";
      b.innerHTML = "<div><b></b><span></span></div><i>放下</i>";
      b.querySelector("b").textContent = spec.zh;
      b.querySelector("span").textContent = spec.lineZh;
      b.addEventListener("click", function (e) {
        e.stopPropagation();
        if (!paused) { wantDrop = k; canvas.focus({ preventScroll: true }); }

  }
  packSignature = signature;
  if (state.dropT >= 0 && state.dropKind && FX.ITEMS[state.dropKind]) {
    ui.whisper.textContent = FX.ITEMS[state.dropKind].lineZh;
    const t = state.dropT;
    const a = t < 0.35 ? t / 0.35 : t > 1.4 ? Math.max(0, 1 - (t - 1.4) / 0.6) : 1;
    ui.whisper.style.opacity = String(a * 0.92);
  } else if (state.reveal && state.revealT >= 0 && FX.ITEMS[state.reveal]) {
    ui.whisper.textContent = FX.ITEMS[state.reveal].backZh;
    ui.whisper.style.opacity = "0.85";
  } else ui.whisper.style.opacity = "0";
  const showEnd = state.mode === "ending" && state.endingT > 0.7;
  ui.ending.classList.toggle("show", showEnd);
  if (showEnd) {
    const lines = (FX.ENDINGS[state.mask] || FX.ENDINGS[15]).zh;
    ui.passage.textContent = lines.join("");
    ui.retrieve.style.display = dropped ? "inline-block" : "none";
    const bit = 1 << (state.mask & 15);
    if ((found & bit) === 0) {
      found |= bit; persist();
      ui.marks.children[state.mask & 15].className = "on";
    }
  }
  ui.marks.classList.toggle("show", showEnd || prologueLeft > 0);
  const top = FX.HOLDS[FX.HOLDS.length - 1].y;
  const t = 1 - clamp01((state.y - 8) / (top - 8));
  ui.now.style.top = (t * 100) + "%";
  ui.alt.textContent = Math.max(8, Math.round(state.y)) + "米";
  const bt = 1 - clamp01((bestEver - 8) / (top - 8));
  ui.best.style.top = (bt * 100) + "%";
}

function focusGame() { canvas.focus({ preventScroll: true }); }
function wakeAudio() {
  ensureAudio();
  if (ac && !muted && !paused && ac.state === "suspended") ac.resume().catch(function () {});
}
ui.mute.addEventListener("click", function (e) {
  e.stopPropagation(); muted = !muted;
  ui.mute.classList.toggle("off", muted);
  ui.mute.textContent = muted ? "静" : "声";
  ui.mute.setAttribute("aria-label", muted ? "开启声音" : "静音");
  if (!muted) wakeAudio();
  if (ac && ac._master) {
    ac._master.gain.cancelScheduledValues(ac.currentTime);
    ac._master.gain.setTargetAtTime(muted ? 0 : 1, ac.currentTime, 0.02);
  }
  persist(); focusGame();
});
function restartRun(e) {
  e.stopPropagation(); cancelCharge(); setPaused(false);
  restartPulse = true; sessionActive = false; prologueLeft = 0; packSignature = "";
  try { localStorage.removeItem(SESSION_KEY); } catch (err) {}
  focusGame();
}
ui.restart.addEventListener("click", restartRun);
ui.again.addEventListener("click", restartRun);
ui.retrieve.addEventListener("click", function (e) { e.stopPropagation(); if (!paused) { cancelCharge(); wantRetrieve = true; focusGame(); } });
ui.packKeep.addEventListener("click", function (e) { e.stopPropagation(); if (!paused) { wantKeep = true; focusGame(); } });
ui.resumePlay.addEventListener("click", function (e) { e.stopPropagation(); wakeAudio(); setPaused(false); focusGame(); });
function down(e) {
  if (paused || activePointer !== null || (e.pointerType === "mouse" && e.button !== 0)) return;
  activePointer = e.pointerId;
  focusGame();
  canvas.setPointerCapture(e.pointerId);
  holding = true; wakeAudio();
  prologueLeft = Math.min(prologueLeft, 0.45);
  e.preventDefault();
}
function up(e) {
  if (e.pointerId !== activePointer) return;
  activePointer = null;
  holding = keyHeld;
}
canvas.addEventListener("pointerdown", down);
window.addEventListener("pointerup", up);
window.addEventListener("pointercancel", function (e) { if (e.pointerId === activePointer) cancelCharge(); });
addEventListener("keydown", function (e) {
  if (e.code === "Escape" && !e.repeat) {
    e.preventDefault(); setPaused(!paused);
    if (!paused) focusGame();
    return;
  }
  if (e.code !== "Space" || e.repeat || paused || (e.target.closest && e.target.closest("button"))) return;
  e.preventDefault(); keyHeld = true; holding = true; wakeAudio();
  prologueLeft = Math.min(prologueLeft, 0.45);
});
addEventListener("keyup", function (e) { if (e.code === "Space" && keyHeld) { e.preventDefault(); keyHeld = false; holding = activePointer !== null; } });
addEventListener("blur", function () { if (!shot) setPaused(true); });
document.addEventListener("visibilitychange", function () { if (document.hidden && !shot) setPaused(true); });
addEventListener("pagehide", function () { persist(); saveSession(); });
function pauseForContextLoss() {
  if (contextLost) return;
  contextLost = true; setPaused(true);
  ui.resumePlay.disabled = true;
  ui.resumePlay.textContent = "画面正在恢复";
  ui.resume.querySelector("p").textContent = "攀登已暂停，位置已保留。";
}
canvas.addEventListener("webglcontextlost", function (e) {
  e.preventDefault(); pauseForContextLoss();
});
canvas.addEventListener("webglcontextrestored", function () {
  contextLost = false;
  ui.resumePlay.disabled = false;
  ui.resumePlay.textContent = "继续攀登";
  ui.resume.querySelector("p").textContent = "停在你离开的这一刻。";
  resize();
});

function applyShot(name) {
  const n = FX.HOLDS.length;
  const mid = FX.HOLDS[holdNear(60)];
  state.intro = 0; state.settle = 1; state.mode = "play"; state.catches = 4;
  state.attached = true; state.descending = false; state.crown = false; state.lost = [];
  const scenic = { base: 10, mid: 90, storm: 150, gale: FX.HOLDS[n - 1].y * 0.92, hang: 28, charge: 36, flight: 48, swing: 55, descend: 70 };
  if (scenic[name] != null && name !== "ending" && name !== "choices" && name !== "summit") {
    state.holdIndex = holdNear(scenic[name]);
    state.origin = state.holdIndex;
  }
  if (name === "storm" || name === "gale") { state.mask = 15; state.stormVis = 1; }
  else if (name === "charge") { state.mask = 15; state.stormVis = 0.08; state.holding = true; }
  else if (name === "descend") { state.mask = 8; state.descending = true; state.holding = true; state.stormVis = 0.2; }
  else if (name === "ending" || name === "choices") {
    state.holdIndex = n - 1; state.origin = n - 1; state.mask = 9; state.mode = "ending"; state.endingT = 2;
    state.lost = [{ kind: "trophy", bit: 4, y: mid.y, z: mid.z, hold: mid.i }];
    state.crown = true;
  } else if (name === "summit") {
    state.holdIndex = n - 1; state.origin = n - 1; state.mask = 11; state.crown = true;
    state.attached = true; state.holding = false; state.holdT = 0;
    state.lost = [{ kind: "trophy", bit: 4, y: mid.y, z: mid.z, hold: mid.i }];
    state.stormVis = 0.35;
  } else state.stormVis = 0.05;
  const h = FX.HOLDS[state.holdIndex];
  if (name === "flight" || name === "swing") {
    state.attached = false; state.mode = "play";
    state.vy = 9.5; state.vz = -0.4; state.flightT = 0.28;
    state.y = h.y + 1.15; state.z = h.z + 0.42;
  } else if (name !== "ending" && name !== "choices") {
    state.attached = true; state.y = h.y - 0.55; state.z = h.z;
  }
  camY = state.y; focusZ = state.z;
}
function pinShot() {
  const h = FX.HOLDS[state.holdIndex];
  if (shotName === "flight" || shotName === "swing") {
    state.attached = false; state.mode = "play";
    state.vy = 9.5; state.vz = -0.4; state.y = h.y + 1.15; state.z = h.z + 0.42;
  } else if (shotName === "charge") {
    state.attached = true; state.mode = "play"; state.holding = true;
    state.holdT = 0.32;
    state.y = h.y - 0.85;
    state.z = h.z + 0.08;
  }
}

function frame(now) {
  if (!live) return;
  // The GL context becomes unavailable before its loss event is dispatched.
  // Do not enter Three's shader setup during that asynchronous gap.
  if (glContext && glContext.isContextLost()) pauseForContextLoss();
  // A paused climb needs one still frame, then no GPU work until resize or
  // context restoration. Keep the lightweight RAF loop ready for input.
  if (contextLost || (paused && !pausedNeedsRender)) {
    requestAnimationFrame(frame);
    return;
  }
  if (shotName === "charge" || shotName === "descend") holding = true;
  if (!last) last = now;
  const elapsed = Math.max(0, (now - last) / 1000);
  const raw = Math.min(0.05, elapsed);
  last = now;
  // Measure wall time, independently of the bounded physics timestep. Even a
  // very slow device should reach the cheaper scene within a few seconds.
  if (!shot && !paused) {
    slowSeconds = elapsed > 1 / 30 ? slowSeconds + Math.min(elapsed, 0.5) : Math.max(0, slowSeconds - elapsed * 2);
    if (slowSeconds >= 2 && quality > 0) {
      quality--;
      slowSeconds = 0;
      FXRender.setQuality(quality);
      resize();
    }
  }
  const portrait = innerWidth < innerHeight;
  if (canvas.width !== Math.floor(innerWidth * renderRatio())) resize();

  const focus = state.mode === "ledge" || state.mode === "drop";
  if (!paused && shotName !== "flight" && shotName !== "swing") acc += raw * (focus ? 0.46 : 1);
  const input = { holding: holding, restart: restartPulse, keep: wantKeep, dropKind: wantDrop, retrieve: wantRetrieve, freezeIntro: shot };
  let n = 0;
  const sounds = [];
  while (acc >= 1 / 120 && n < 8) {
    FX.step(state, 1 / 120, input);
    if (state.sfx) sounds.push.apply(sounds, state.sfx);
    acc -= 1 / 120;
    n++;
    input.restart = false; input.keep = false; input.dropKind = ""; input.retrieve = false;
  }
  if (n > 0) { restartPulse = false; wantKeep = false; wantDrop = ""; wantRetrieve = false; }
  pinShot();
  playSfx(sounds);
  if (!shot && state.y > bestEver) bestEver = state.y;
  if (!paused && !shot) {
    sessionClock += elapsed;
    if (sessionClock >= 1) { sessionClock = 0; persist(); saveSession(); }
  }

  const top = FX.HOLDS[FX.HOLDS.length - 1].y;
  const altN = clamp01((state.y - 8) / Math.max(20, top - 8));
  const forecast = FX.gustForecast(state.time, state.y, state.mask, state.descending);
  const gale = Math.min(1, Math.max(0, (state.y - top * 0.58) / 28));
  const storm = state.stormVis || 0;
  const wet = Math.min(1, storm * 0.8 + gale);
  if (gale > 0.35 && forecast.soon > 0.85 && Math.random() < 0.012) flash = 1;
  flash *= Math.exp(-raw * 6);
  gustAudio(forecast);

  const standing = state.crown || state.mode === "ledge" || state.mode === "ending";
  let lookY = state.y + (standing ? 1.8 : 0.9);
  const target = FX.HOLDS[state.holdIndex + (state.descending ? -1 : 1)];
  if (target && state.attached && !standing) lookY += Math.max(-0.35, Math.min(0.35, (target.y - state.y) * 0.06));
  const cameraEase = shot ? 1 : 1 - Math.exp(-raw * 7);
  camY += (lookY - camY) * cameraEase;
  camY = Math.max(lookY - 1.1, Math.min(lookY + 1.1, camY));
  focusZ += (state.z - focusZ) * (shot ? 1 : 1 - Math.exp(-raw * 9));
  try {
    FXRender.draw({
      state: state,
      dt: paused ? 0 : raw,
      portrait: portrait,
      flash: flash,
      gale: gale,
      storm: storm,
      wet: wet,
      alt: altN,
      camY: camY,
      focusZ: focusZ,
      close: shotName === "swing",
      side: shotName === "charge" || shotName === "flight" || shotName === "swing",
    });
  } catch (error) {
    // A GPU loss can also interrupt a draw already in progress. Recover that
    // specific lifecycle event; genuine rendering errors must remain visible.
    if (!glContext || !glContext.isContextLost()) throw error;
    pauseForContextLoss();
  }
  syncUI(paused ? 0 : elapsed);
  pausedNeedsRender = false;
  requestAnimationFrame(frame);
}

if (shotName) applyShot(shotName);
if (restoredSession) setPaused(true);
ui.mute.setAttribute("aria-label", muted ? "开启声音" : "静音");
resize();
requestAnimationFrame(frame);
window.__fx = {
  get state() { return state; },
  get fps() { return FXRender.fps; },
  get quality() { return quality; },
  holds: FX.HOLDS,
  get paused() { return paused; },
};
</script>
</body>
</html>
