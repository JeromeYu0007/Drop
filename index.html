  ui.resumePlay.disabled = false;
  ui.resumePlay.textContent = "继续攀登";
  ui.resume.querySelector("p").textContent = "停在你离开的这一刻。";
  resize();
});

function applyShot(name) {
  const n = FX.HOLDS.length;
  const mid = FX.HOLDS[holdNear(60)];
  state.intro = 0; state.settle = 1; state.mode = "play"; state.catches = 4;
  state.attached = true; state.descending = false; state.returning = false; state.crown = false; state.lost = [];
  const scenic = { base: 10, mid: 90, storm: 150, gale: FX.HOLDS[n - 1].y * 0.92, hang: 28, charge: 36, flight: 48, swing: 55, descend: 70 };
  if (scenic[name] != null && name !== "ending" && name !== "choices" && name !== "summit") {
    state.holdIndex = holdNear(scenic[name]);
    state.origin = state.holdIndex;
  }
  if (name === "storm" || name === "gale") { state.mask = 15; state.stormVis = 1; }
  else if (name === "charge") { state.mask = 15; state.stormVis = 0.08; state.holding = true; }
  else if (name === "descend") { state.mask = 8; state.descending = true; state.returning = true; state.holding = true; state.stormVis = FX.weatherAt(scenic.descend, true).intensity; }
  else if (name === "ending" || name === "choices") {
    state.holdIndex = n - 1; state.origin = n - 1; state.mask = 9; state.mode = "ending"; state.endingT = 2;
    state.lost = [{ kind: "trophy", bit: 4, y: mid.y, z: mid.z, hold: mid.i }];
    state.crown = true;
  } else if (name === "summit") {
    state.holdIndex = n - 1; state.origin = n - 1; state.mask = 11; state.crown = true;
    state.attached = true; state.holding = false; state.holdT = 0;
    state.lost = [{ kind: "trophy", bit: 4, y: mid.y, z: mid.z, hold: mid.i }];
    state.stormVis = 0.35;
  } else state.stormVis = 0.05;
  const h = FX.HOLDS[state.holdIndex];
  if (name === "flight" || name === "swing") {
    state.attached = false; state.mode = "play";
    state.vy = 9.5; state.vz = -0.4; state.flightT = 0.28;
    state.y = h.y + 1.15; state.z = h.z + 0.42;
  } else {
    state.attached = true; state.y = h.y + (state.crown ? 0.22 : -0.55); state.z = h.z;
  }
  camY = state.y; focusZ = state.z;
}
function pinShot() {
  const h = FX.HOLDS[state.holdIndex];
  if (shotName === "flight" || shotName === "swing") {
    state.attached = false; state.mode = "play";
    state.vy = 9.5; state.vz = -0.4; state.y = h.y + 1.15; state.z = h.z + 0.42;
  } else if (shotName === "charge") {
    state.attached = true; state.mode = "play"; state.holding = true;
    state.holdT = 0.32;
    state.y = h.y - 0.85;
    state.z = h.z + 0.08;
  }
}

function frame(now) {
  if (!live) return;
  // The GL context becomes unavailable before its loss event is dispatched.
  // Do not enter Three's shader setup during that asynchronous gap.
  if (glContext && glContext.isContextLost()) pauseForContextLoss();
  // A paused climb needs one still frame, then no GPU work until resize or
  // context restoration. Keep the lightweight RAF loop ready for input.
  if (contextLost || (paused && !pausedNeedsRender)) {
    requestAnimationFrame(frame);
    return;
  }
  if (shotName === "charge" || shotName === "descend") holding = true;
  if (!last) last = now;
  const elapsed = Math.max(0, (now - last) / 1000);
  const raw = Math.min(0.05, elapsed);
  last = now;
  // Measure wall time, independently of the bounded physics timestep. Even a
  // very slow device should reach the cheaper scene within a few seconds.
  if (!shot && !paused) {
    slowSeconds = elapsed > 1 / 30 ? slowSeconds + Math.min(elapsed, 0.5) : Math.max(0, slowSeconds - elapsed * 2);
    if (slowSeconds >= 2 && quality > 0) {
      quality--;
      slowSeconds = 0;
      FXRender.setQuality(quality);
      resize();
    }
  }
  const portrait = innerWidth < innerHeight;
  if (canvas.width !== Math.floor(innerWidth * renderRatio())) resize();

  const focus = state.mode === "ledge" || state.mode === "drop";
  if (!paused && shotName !== "flight" && shotName !== "swing") acc += raw * (focus ? 0.46 : 1);
  const input = { holding: pendingRelease ? false : holding, restart: restartPulse, keep: wantKeep, dropKind: wantDrop, retrieve: wantRetrieve, direction: wantDirection, freezeIntro: shot };
  let n = 0;
  const sounds = [];
  while (acc >= 1 / 120 && n < 8) {
    FX.step(state, 1 / 120, input);
    // A release followed by another press between display frames is still a
    // release. Consume it once, then expose the current held state to physics.
    // Leave the edge pending when this display frame has no physics tick.
    pendingRelease = false;
    input.holding = holding;
    if (state.sfx) sounds.push.apply(sounds, state.sfx);
    acc -= 1 / 120;
    n++;
    input.restart = false; input.keep = false; input.dropKind = ""; input.retrieve = false; input.direction = "";
  }
  if (n > 0) { restartPulse = false; wantKeep = false; wantDrop = ""; wantRetrieve = false; wantDirection = ""; }
  pinShot();
  if (!paused && FX.updateGuide(state)) sounds.push("arm");
  playSfx(sounds);
  if (!shot && state.y > bestEver) bestEver = state.y;
  if (!paused && !shot) {
    sessionClock += elapsed;
    if (sessionClock >= 1) { sessionClock = 0; persist(); saveSession(); }
  }

  const top = FX.HOLDS[FX.HOLDS.length - 1].y;
  const altN = clamp01((state.y - 8) / Math.max(20, top - 8));
  const forecast = FX.gustForecast(state.time, state.y, state.mask, state.returning);
  const weather = FX.weatherAt(state.y, state.returning);
  const storm = clamp01(Number.isFinite(state.stormVis) ? state.stormVis : weather.intensity);
  const gale = clamp01((storm - .1) / .9);
  const wet = clamp01(storm * .8 + gale * .35);
  const weatherDt = paused ? 0 : raw;
  flashCooldown = Math.max(0, flashCooldown - weatherDt);
  // A rate per second keeps storms consistent across frame rates. Darkness
  // separates flashes, and reduced-motion mode removes them altogether.
  if (reducedMotionPreference.matches) flash = 0;
  else if (weatherDt > 0 && flashCooldown === 0 && gale > .35 && Math.abs(forecast.soon) > .5 && Math.random() < 1 - Math.exp(-(.035 + gale * .10) * weatherDt)) {
    flash = .8;
    flashCooldown = 4.5 + Math.random() * 2;
  }
  flash *= Math.exp(-weatherDt * 6);
  gustAudio(forecast);

  const standing = state.mode === "ending" || state.crown && !state.descending;
  let lookY = state.y + (standing ? 1.8 : 0.9);
  const target = FX.HOLDS[state.holdIndex + (state.descending ? -1 : 1)];
  if (target && state.attached && !standing) lookY += Math.max(-0.35, Math.min(0.35, (target.y - state.y) * 0.06));
  const cameraEase = shot ? 1 : 1 - Math.exp(-raw * 7);
  camY += (lookY - camY) * cameraEase;
  camY = Math.max(lookY - 1.1, Math.min(lookY + 1.1, camY));
  focusZ += (state.z - focusZ) * (shot ? 1 : 1 - Math.exp(-raw * 9));
  try {
    FXRender.draw({
      state: state,
      dt: paused ? 0 : raw,
      portrait: portrait,
      flash: flash,
      gale: gale,
      storm: storm,
      wet: wet,
      alt: altN,
      camY: camY,
      focusZ: focusZ,
      close: shotName === "swing",
      side: shotName === "charge" || shotName === "flight" || shotName === "swing",
    });
  } catch (error) {
    // A GPU loss can also interrupt a draw already in progress. Recover that
    // specific lifecycle event; genuine rendering errors must remain visible.
    if (!glContext || !glContext.isContextLost()) throw error;
    pauseForContextLoss();
  }
  syncUI(paused ? 0 : elapsed);
  pausedNeedsRender = false;
  requestAnimationFrame(frame);
}

if (shotName) applyShot(shotName);
if (restoredSession) setPaused(true);
ui.mute.setAttribute("aria-label", muted ? "开启声音" : "静音");
resize();
requestAnimationFrame(frame);
window.__fx = {
  get state() { return state; },
  get fps() { return FXRender.fps; },
  get quality() { return quality; },
  holds: FX.HOLDS,
  get paused() { return paused; },
};
</script>
</body>
</html>
