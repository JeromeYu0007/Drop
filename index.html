<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<meta name="description" content="放下。按住蓄力，松开。">
<title>放下</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2307080c' width='32' height='32'/%3E%3Cpath d='M7 27 L16 5 L25 27' fill='none' stroke='%23f3efe6' stroke-width='1.2'/%3E%3C/svg%3E">
<style>
  :root { --paper: #f3efe6; --dim: rgba(243,239,230,.72); --ink: #07080c; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--ink); color: var(--paper);
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
    font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "PMingLiU", "SimSun", Palatino, serif;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  button {
    pointer-events: none; background: none; border: 0; color: var(--paper);
    font: inherit; letter-spacing: 0.22em; font-size: 14px; opacity: 0.84;
    padding: 12px 10px; cursor: pointer; touch-action: manipulation;
  }
  #bar button, #pack.show button, #ending.show button, #endChoices button { pointer-events: auto; }
  #pack:not(.show), #pack:not(.show) *,
  #ending:not(.show), #ending:not(.show) * { pointer-events: none !important; }
  #bar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 0 calc(10px + env(safe-area-inset-left));
  }
  #prologue, #whisper, #ending, #hint {
    position: absolute; left: 50%; transform: translateX(-50%);
    text-align: center; text-shadow: 0 2px 18px rgba(0,0,0,.72);
  }
  #prologue {
    top: 18vh; width: min(86vw, 520px); opacity: 0; transition: opacity 1.1s ease;
  }
  #prologue p {
    margin: 0.55em 0; font-size: clamp(16px, 2.2vh, 22px);
    letter-spacing: 0.12em; line-height: 1.85; opacity: 0; transition: opacity 1.3s ease;
  }
  #prologue.show { opacity: 1; }
  #prologue.show p { opacity: 1; }
  #prologue p:nth-child(2) { transition-delay: .45s; }
  #prologue p:nth-child(3) { transition-delay: .9s; }
  #hint {
    bottom: calc(8vh + env(safe-area-inset-bottom)); width: min(90vw, 420px);
    font-size: 14px; letter-spacing: 0.14em; opacity: 0; transition: opacity .6s ease;
  }
  #whisper {
    top: 14vh; width: min(84vw, 440px); margin: 0;
    font-size: 17px; letter-spacing: 0.14em; line-height: 1.7; opacity: 0;
  }
  #meter {
    position: absolute; right: calc(16px + env(safe-area-inset-right));
    top: 16vh; bottom: 14vh; width: 64px;
  }
  #meter .track {
    position: absolute; right: 8px; top: 0; bottom: 0; width: 1px;
    background: linear-gradient(to top, rgba(243,239,230,.28), rgba(196,90,70,.95));
  }
  #bestMark { position: absolute; right: 4px; width: 9px; height: 1px; background: #e6c27a; transform: translateY(50%); }
  #nowMark {
    position: absolute; right: 3px; width: 10px; height: 10px; border-radius: 50%;
    border: 1px solid var(--paper); background: #c45a46; transform: translateY(50%);
  }
  #alt {
    position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
    font-size: 12px; letter-spacing: 0.08em; white-space: nowrap;
    text-shadow: 0 1px 6px rgba(0,0,0,.7);
  }
  #pack {
    position: absolute; left: 50%; bottom: calc(6vh + env(safe-area-inset-bottom));
    transform: translateX(-50%); width: min(92vw, 420px);
    padding: 16px 16px 12px; background: rgba(8,9,12,.78);
    border: 1px solid rgba(243,239,230,.16);
    opacity: 0; pointer-events: none; text-align: center; transition: opacity .5s ease;
  }
  #pack.show { opacity: 1; pointer-events: auto; }
  #pack h2 { margin: 0 0 .6em; font-weight: 400; letter-spacing: .28em; font-size: 22px; }
  .mem {
    display: flex; gap: 10px; align-items: center; text-align: left; width: 100%;
    margin: 0 0 8px; padding: 8px 8px 8px 12px; min-height: 48px;
    border: 1px solid rgba(243,239,230,.14);
  }
  .mem b { display: block; font-weight: 400; letter-spacing: .16em; }
  .mem span { display: block; margin-top: .15em; font-size: 12px; letter-spacing: .06em; color: var(--dim); }
  .mem i { font-style: normal; letter-spacing: .18em; color: #e7c9a2; padding: 12px; }
  #packKeep { margin-top: 4px; letter-spacing: .22em; border-bottom: 1px solid rgba(243,239,230,.45); min-height: 44px; }
  #ending {
    top: 16vh; width: min(88vw, 460px); opacity: 0; pointer-events: none; transition: opacity 1.2s ease;
  }
  #ending.show { opacity: 1; pointer-events: auto; }
  #passage {
    margin: 0; font-size: clamp(16px, 2.15vh, 20px); letter-spacing: .14em;
    line-height: 2; font-weight: 400;
  }
  #endChoices { margin-top: 1.6em; display: flex; justify-content: center; gap: 1.6em; }
  #endChoices button { letter-spacing: .28em; border-bottom: 1px solid rgba(243,239,230,.5); padding: 8px 4px; font-size: 15px; }
  #backHint {
    position: absolute; margin: 0; letter-spacing: .16em; font-size: 14px;
    color: rgba(246,241,232,.86); opacity: 0; pointer-events: none;
    text-shadow: 0 0 10px rgba(8,6,5,.95), 0 1px 2px rgba(8,6,5,.9);
    background: radial-gradient(ellipse at center, rgba(12,10,9,.55), rgba(12,10,9,0) 70%);
    padding: 6px 10px;
  }
  #marks { position: absolute; left: 50%; bottom: calc(3.5vh + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 5px; opacity: 0; }
  #marks.show { opacity: .8; }
  #marks span { width: 7px; height: 7px; display: block; box-shadow: inset 0 0 0 1px rgba(243,239,230,.55); transform: rotate(45deg); }
  #marks span.on { background: #f3efe6; }
  @media (max-aspect-ratio: 4/5) {
    #prologue { top: 14vh; }
    #passage { letter-spacing: .1em; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="bar">
    <button id="mute" type="button">声</button>
    <button id="restart" type="button">重来</button>
  </div>
  <div id="prologue"></div>
  <p id="hint"></p>
  <p id="whisper"></p>
  <p id="backHint">长按，可以回头</p>
  <div id="meter" aria-hidden="true"><div class="track"></div><div id="bestMark"></div><div id="nowMark"><b id="alt"></b></div></div>
  <section id="pack">
    <h2>背包</h2>
    <div id="packItems"></div>
    <button id="packKeep" type="button">继续</button>
  </section>
  <div id="marks"></div>
  <section id="ending">
    <p id="passage"></p>
    <div id="endChoices">
      <button id="again" type="button">重玩</button>
      <button id="retrieve" type="button">下山去捡</button>
    </div>
  </section>
</div>
<script src="vendor/three.min.js?v=c3b026a"></script>
<script src="game.js?v=c3b026a"></script>
<script src="render.js?v=6bf4b4e"></script>
<script>
"use strict";
const FX = window.Fangxia;
const canvas = document.getElementById("c");
let live = true;
try { FXRender.init(canvas); }
catch (e) {
  live = false;
  document.body.insertAdjacentHTML("beforeend", "<p style='position:fixed;inset:0;display:flex;align-items:center;justify-content:center'>需要 WebGL</p>");
}
const ui = {
  prologue: document.getElementById("prologue"),
  hint: document.getElementById("hint"),
  whisper: document.getElementById("whisper"),
  back: document.getElementById("backHint"),
  mute: document.getElementById("mute"),
  restart: document.getElementById("restart"),
  pack: document.getElementById("pack"),
  packItems: document.getElementById("packItems"),
  packKeep: document.getElementById("packKeep"),
  ending: document.getElementById("ending"),
  passage: document.getElementById("passage"),
  again: document.getElementById("again"),
  retrieve: document.getElementById("retrieve"),
  alt: document.getElementById("alt"),
  now: document.getElementById("nowMark"),
  best: document.getElementById("bestMark"),
  marks: document.getElementById("marks"),
};
const shotName = new URLSearchParams(location.search).get("shot") || "";
const shot = !!shotName;
const SAVE_KEY = "fangxia-v1";
function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; } }
function writeSave(data) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) {} }
const saved = loadSave();
let found = saved.found | 0;
let muted = !!saved.mute;
let bestEver = saved.best || 8;
function persist() { writeSave({ found: found, mute: muted, best: bestEver, lang: "zh" }); }
ui.mute.classList.toggle("off", muted);
ui.mute.textContent = muted ? "静" : "声";
FX.PROLOGUE.forEach(function (line) {
  const p = document.createElement("p");
  p.textContent = line;
  ui.prologue.appendChild(p);
});
for (let i = 0; i < 16; i++) {
  const s = document.createElement("span");
  if (found & (1 << i)) s.className = "on";
  ui.marks.appendChild(s);
}
const coarse = matchMedia("(pointer: coarse)").matches;
let quality = coarse || innerWidth < innerHeight ? 1 : 2;
if (live) FXRender.setQuality(quality);
let camY = 12, focusZ = 0;
const state = FX.createState();
let holding = false;
let wantKeep = false, wantDrop = "", wantRetrieve = false, restartPulse = false;
let acc = 0, last = 0;
let backT = -1, backWait = true;
let prologueLeft = shot ? 0 : 7.2;
let frames = 0, slowF = 0;
let flash = 0;

function resize() {
  if (!live) return;
  const portrait = innerWidth < innerHeight;
  const dpr = quality === 0 ? 1 : Math.min(portrait ? 1.15 : 1.35, devicePixelRatio || 1);
  FXRender.resize(innerWidth, innerHeight, dpr);
}
addEventListener("resize", resize);

function clamp01(v) { return Math.max(0, Math.min(1, v)); }
function holdNear(y) {
  let best = 0, bd = 1e9;
  for (let i = 0; i < FX.HOLDS.length; i++) {
    const d = Math.abs(FX.HOLDS[i].y - y);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

let ac = null, gustOn = false;
function ensureAudio() {
  if (ac || muted) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ac = new AC();
  const n = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const d = n.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource();
  src.buffer = n; src.loop = true;
  const f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = 400;
  const g = ac.createGain(); g.gain.value = 0.0;
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start();
  ac._wind = g; ac._filt = f;
}
function gustAudio(fc) {
  if (muted) return;
  ensureAudio();
  if (!ac) return;
  const amp = Math.min(0.08, 0.004 + Math.abs(fc.now) * 0.02 + Math.abs(fc.soon) * 0.012);
  ac._wind.gain.setTargetAtTime(amp, ac.currentTime, 0.2);
  ac._filt.frequency.setTargetAtTime(280 + Math.abs(fc.soon) * 500, ac.currentTime, 0.3);
  const coming = Math.abs(fc.soon) > Math.abs(fc.now) + 0.25 && Math.abs(fc.soon) > 0.45;
  if (coming && !gustOn) {
    gustOn = true;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(90, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(220, ac.currentTime + 0.7);
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.04, ac.currentTime + 0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.95);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + 1);
  }
  if (!coming) gustOn = false;
}
function tone(freq, dur, type, gain) {
  if (!ac || muted) return;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type || "sine";
  o.frequency.value = freq;
  g.gain.setValueAtTime(gain || 0.05, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur);
}
function playSfx(list) {
  if (!list || muted) return;
  ensureAudio();
  list.forEach(function (s) {
    if (s === "catch" || s === "land") tone(s === "land" ? 90 : 180, 0.12, "sine", 0.06);
    else if (s === "release") tone(240, 0.08, "triangle", 0.04);
    else if (s === "arm") tone(520, 0.06, "sine", 0.03);
    else if (s === "impact") tone(50, 0.3, "sawtooth", 0.07);
    else if (s === "summit") tone(330, 0.5, "sine", 0.05);
    else if (s === "slip") tone(140, 0.15, "triangle", 0.04);
  });
}

function syncUI(dt) {
  const dropped = state.lost && state.lost.length;
  if (!state.crown) { backT = -1; backWait = true; }
  else if (backWait && dropped && state.attached) { backT = 0; backWait = false; }
  if (backT >= 0) {
    if (holding && backT > 0.18) backT = -1;
    else { backT += dt; if (backT > 3.4) backT = -1; }
  }
  ui.back.style.opacity = state.mode !== "ending" && backT > 0.2 && backT < 3.2 ? "0.86" : "0";
  if (backT > 0) {
    ui.back.style.left = "16%";
    ui.back.style.top = (innerHeight * 0.4) + "px";
    ui.back.style.transform = "none";
  }
  if (!shot && prologueLeft > 0 && state.intro > 0.2) {
    prologueLeft -= dt;
    ui.prologue.classList.add("show");
    if (holding) prologueLeft = Math.min(prologueLeft, 0.4);
  } else ui.prologue.classList.remove("show");
  ui.hint.style.opacity = state.intro < 0.15 && state.catches < 2 && state.mode === "play" ? "0.8" : "0";
  ui.hint.textContent = state.attached ? "按住蓄力，弧线碰到岩点再松开" : "下坠时按住，也许还能抓住";
  const showPack = state.mode === "ledge";
  ui.pack.classList.toggle("show", showPack);
  if (showPack) {
    ui.packItems.innerHTML = "";
    FX.ORDER.forEach(function (k) {
      const spec = FX.ITEMS[k];
      if (!(state.mask & spec.bit)) return;
      const b = document.createElement("button");
      b.className = "mem"; b.type = "button";
      b.innerHTML = "<div><b></b><span></span></div><i>放下</i>";
      b.querySelector("b").textContent = spec.zh;
      b.querySelector("span").textContent = spec.lineZh;
      b.addEventListener("pointerdown", function (e) { e.stopPropagation(); e.preventDefault(); });
      b.addEventListener("pointerup", function (e) {
        e.stopPropagation(); e.preventDefault();
        wantDrop = k;
      });
      ui.packItems.appendChild(b);
    });
  }
  if (state.dropT >= 0 && state.dropKind && FX.ITEMS[state.dropKind]) {
    ui.whisper.textContent = FX.ITEMS[state.dropKind].lineZh;
    const t = state.dropT;
    const a = t < 0.35 ? t / 0.35 : t > 1.4 ? Math.max(0, 1 - (t - 1.4) / 0.6) : 1;
    ui.whisper.style.opacity = String(a * 0.92);
  } else if (state.reveal && state.revealT >= 0 && FX.ITEMS[state.reveal]) {
    ui.whisper.textContent = FX.ITEMS[state.reveal].backZh;
    ui.whisper.style.opacity = "0.85";
  } else ui.whisper.style.opacity = "0";
  const showEnd = state.mode === "ending" && state.endingT > 0.7;
  ui.ending.classList.toggle("show", showEnd);
  if (showEnd) {
    const lines = (FX.ENDINGS[state.mask] || FX.ENDINGS[15]).zh;
    ui.passage.textContent = lines.join("");
    ui.retrieve.style.display = dropped ? "inline-block" : "none";
    const bit = 1 << (state.mask & 15);
    if ((found & bit) === 0) {
      found |= bit; persist();
      ui.marks.children[state.mask & 15].className = "on";
    }
  }
  ui.marks.classList.toggle("show", showEnd || prologueLeft > 0);
  const top = FX.HOLDS[FX.HOLDS.length - 1].y;
  const t = 1 - clamp01((state.y - 8) / (top - 8));
  ui.now.style.top = (t * 100) + "%";
  ui.alt.textContent = Math.max(0, Math.round(state.y)) + "米";
  const bt = 1 - clamp01((bestEver - 8) / (top - 8));
  ui.best.style.top = (bt * 100) + "%";
}

ui.mute.addEventListener("pointerup", function (e) {
  e.stopPropagation(); muted = !muted; ui.mute.classList.toggle("off", muted);
  ui.mute.textContent = muted ? "静" : "声"; persist();
});
ui.restart.addEventListener("pointerup", function (e) { e.stopPropagation(); restartPulse = true; });
ui.again.addEventListener("pointerup", function (e) { e.stopPropagation(); restartPulse = true; });
ui.retrieve.addEventListener("pointerup", function (e) { e.stopPropagation(); wantRetrieve = true; });
ui.packKeep.addEventListener("pointerup", function (e) { e.stopPropagation(); wantKeep = true; });
function down(e) {
  if (e.target.closest && e.target.closest("button")) return;
  holding = true; ensureAudio();
  if (ac && ac.state === "suspended") ac.resume();
}
function up() { holding = false; }
canvas.addEventListener("pointerdown", down);
window.addEventListener("pointerup", up);
window.addEventListener("pointercancel", up);
addEventListener("keydown", function (e) { if (e.code === "Space") { e.preventDefault(); holding = true; ensureAudio(); } });
addEventListener("keyup", function (e) { if (e.code === "Space") holding = false; });

function applyShot(name) {
  const n = FX.HOLDS.length;
  const mid = FX.HOLDS[holdNear(60)];
  state.intro = 0; state.settle = 1; state.mode = "play"; state.catches = 4;
  state.attached = true; state.descending = false; state.crown = false; state.lost = [];
  const scenic = { base: 10, mid: 90, storm: 150, gale: FX.HOLDS[n - 1].y * 0.92, hang: 28, charge: 36, flight: 48, swing: 55, descend: 70 };
  if (scenic[name] != null && name !== "ending" && name !== "choices" && name !== "summit") {
    state.holdIndex = holdNear(scenic[name]);
    state.origin = state.holdIndex;
  }
  if (name === "storm" || name === "gale") { state.mask = 15; state.stormVis = 1; }
  else if (name === "charge") { state.mask = 15; state.stormVis = 0.08; state.holding = true; }
  else if (name === "descend") { state.mask = 8; state.descending = true; state.holding = true; state.stormVis = 0.2; }
  else if (name === "ending" || name === "choices") {
    state.holdIndex = n - 1; state.origin = n - 1; state.mask = 9; state.mode = "ending"; state.endingT = 2;
    state.lost = [{ kind: "trophy", bit: 4, y: mid.y, z: mid.z, hold: mid.i }];
    state.crown = true;
  } else if (name === "summit") {
    state.holdIndex = n - 1; state.origin = n - 1; state.mask = 11; state.crown = true;
    state.attached = true; state.holding = false; state.holdT = 0;
    state.lost = [{ kind: "trophy", bit: 4, y: mid.y, z: mid.z, hold: mid.i }];
    state.stormVis = 0.35;
  } else state.stormVis = 0.05;
  const h = FX.HOLDS[state.holdIndex];
  if (name === "flight" || name === "swing") {
    state.attached = false; state.mode = "play";
    state.vy = 9.5; state.vz = -0.4; state.flightT = 0.28;
    state.y = h.y + 1.15; state.z = h.z + 0.42;
  } else if (name !== "ending" && name !== "choices") {
    state.attached = true; state.y = h.y - 0.55; state.z = h.z;
  }
  camY = state.y; focusZ = state.z;
}
function pinShot() {
  const h = FX.HOLDS[state.holdIndex];
  if (shotName === "flight" || shotName === "swing") {
    state.attached = false; state.mode = "play";
    state.vy = 9.5; state.vz = -0.4; state.y = h.y + 1.15; state.z = h.z + 0.42;
  } else if (shotName === "charge") {
    state.attached = true; state.mode = "play"; state.holding = true;
    state.holdT = 0.32;
    state.y = h.y - 0.85;
    state.z = h.z + 0.08;
  }
}

function frame(now) {
  if (!live) return;
  if (shotName === "charge" || shotName === "descend") holding = true;
  if (!last) last = now;
  const raw = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  frames++;
  if (!shot && frames > 40 && raw > 0.03) slowF++;
  else slowF = Math.max(0, slowF - 1);
  if (!shot && slowF > 24 && quality > 0) {
    quality--;
    slowF = 0;
    FXRender.setQuality(quality);
    resize();
  }
  const portrait = innerWidth < innerHeight;
  const want = quality === 0 ? 1 : Math.min(portrait ? 1.15 : 1.35, devicePixelRatio || 1);
  if (canvas.width !== Math.floor(innerWidth * want)) resize();

  const focus = state.mode === "ledge" || state.mode === "drop";
  if (shotName !== "flight" && shotName !== "swing") acc += raw * (focus ? 0.46 : 1);
  const input = { holding: holding, restart: restartPulse, keep: wantKeep, dropKind: wantDrop, retrieve: wantRetrieve, freezeIntro: shot };
  let n = 0;
  const sounds = [];
  while (acc >= 1 / 120 && n < 8) {
    FX.step(state, 1 / 120, input);
    if (state.sfx) sounds.push.apply(sounds, state.sfx);
    acc -= 1 / 120;
    n++;
    input.restart = false; input.keep = false; input.dropKind = ""; input.retrieve = false;
  }
  if (n > 0) { restartPulse = false; wantKeep = false; wantDrop = ""; wantRetrieve = false; }
  pinShot();
  playSfx(sounds);
  if (state.y > bestEver) { bestEver = state.y; persist(); }

  const top = FX.HOLDS[FX.HOLDS.length - 1].y;
  const altN = clamp01((state.y - 8) / Math.max(20, top - 8));
  const forecast = FX.gustForecast(state.time, state.y, state.mask, state.descending);
  const gale = Math.min(1, Math.max(0, (state.y - top * 0.58) / 28));
  const storm = state.stormVis || 0;
  const wet = Math.min(1, storm * 0.8 + gale);
  if (gale > 0.35 && forecast.soon > 0.85 && Math.random() < 0.012) flash = 1;
  flash *= Math.exp(-raw * 6);
  gustAudio(forecast);

  let lookY = state.y + (state.attached ? 0.6 : 0.2);
  let lookZ = state.z;
  if (state.mode !== "ending" && state.descending && state.lost && state.lost.length) {
    let item = state.lost[0];
    for (let i = 1; i < state.lost.length; i++) if (state.lost[i].y > item.y) item = state.lost[i];
    lookY += (item.y - lookY) * 0.35;
  }
  camY += (lookY - camY) * (shot ? 1 : 0.08);
  focusZ += (lookZ - focusZ) * (shot ? 1 : 0.1);
  FXRender.draw({
    state: state,
    dt: raw,
    portrait: portrait,
    flash: flash,
    gale: gale,
    storm: storm,
    wet: wet,
    alt: altN,
    camY: camY,
    focusZ: focusZ,
    close: shotName === "swing",
    side: shotName === "charge" || shotName === "flight" || shotName === "swing",
  });
  syncUI(raw);
  requestAnimationFrame(frame);
}

if (shotName) applyShot(shotName);
resize();
requestAnimationFrame(frame);
window.__fx = {
  get state() { return state; },
  get fps() { return FXRender.fps; },
  get quality() { return quality; },
  holds: FX.HOLDS,
};
</script>
</body>
</html>
