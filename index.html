    state.mask = 15;
    state.stormVis = 0.22;
    state.intro = 0;
    state.visAngle = 0.5;
    state.angle = 0.5;
  } else if (name === "ice") {
    window.__fx.teleport(26);
    state.mask = 15;
    state.stormVis = 0.12;
    state.intro = 0;
    state.visAngle = 0.62;
    state.angle = 0.62;
  } else if (name === "summit") {
    window.__fx.teleport(FX.HOLDS.length - 1);
    state.crown = true;
    state.mask = 11;
    state.stormVis = 0.04;
    state.intro = 0;
    const h = FX.HOLDS[state.holdIndex];
    state.y = h.y + 0.22;
    const below = FX.HOLDS[state.holdIndex - 2];
    state.lost = [{ kind: "trophy", bit: 4, y: below.y + 0.2, z: Math.max(below.z + 0.3, FX.faceZ(below.y) + 0.45), hold: below.i }];
  } else if (name === "ends") {
    found = 0x5a3d;
    paintMarks();
    window.__fx.ending(9);
    state.reclaimed = 8;
    state.intro = 0;
  }
  snap = true;
}

window.__fx = {
  ready,
  state() {
    return {
      mode: state.mode, y: state.y, z: state.z, mask: state.mask, hold: state.holdIndex,
      catches: state.catches, falls: state.falls, intro: state.intro, attached: state.attached,
      endingT: state.endingT, time: state.time, crown: !!state.crown, descending: !!state.descending,
      checkpoint: state.checkpoint || 0, armed: !!state.armed, holdT: state.holdT || 0,
      reclaimed: state.reclaimed || 0, lost: (state.lost || []).length,
    };
  },
  points() {
    const rect = canvas.getBoundingClientRect();
    const hold = FX.HOLDS[state.holdIndex];
    const doorZ = Math.max(FX.GATE.z, FX.faceZ(FX.GATE.y) + 0.72);
    const door = toS(doorZ, FX.GATE.y);
    const edge = toS(FX.faceZ(hold.y - 1.5) + 0.35, hold.y - 1.7);
    const sx = (px) => rect.left + (px / canvas.width) * rect.width;
    const sy = (py) => rect.top + (py / canvas.height) * rect.height;
    return {
      door: { x: sx(door[0]), y: sy(door[1]) },
      edge: { x: sx(edge[0]), y: sy(edge[1]) },
    };
  },
  teleport(i) {
    const h = FX.HOLDS[i];
    state.holdIndex = i; state.attached = true; state.mode = "play";
    state.settle = 1; state.holdT = 0; state.intro = 0;
    state.vy = state.vz = state.angle = state.visAngle = 0;
    state.y = h.y - FX.L; state.z = h.z; state.origin = i;
    state.flightT = 0; state.dots = []; state.catches = 6; state.launches = 4;
    snap = true;
  },
  mask(m) { state.mask = m; },
  fallFrom(i) {
    this.teleport(i);
    const h = FX.HOLDS[i];
    state.attached = false; state.mode = "play";
    state.vy = -18; state.vz = 0.8;
    state.y = h.y - 5; state.z = h.z + 0.8;
    state.flightT = 0.6; state.origin = i;
    state.angle = Math.atan2(-state.vz, state.vy);
    state.visAngle = state.angle;
    snap = true;
  },
  openPack(i) {
    this.teleport(i);
    state.mode = "ledge";
    state.seenRelease = true;
    state.restSeen |= 1 << i;
    snap = true;
  },
  ending(mask) {
    this.teleport(FX.HOLDS.length - 1);
    state.mask = mask; state.mode = "ending"; state.endingT = 2.4;
    state.stormVis = FX.stormOf(mask);
    const h = FX.HOLDS[state.holdIndex];
    state.y = h.y + 0.22; state.z = h.z;
    snap = true;
  },
  bump(i) {
    this.teleport(i);
    state.attached = false;
    state.mode = "play";
    state.vy = 5;
    state.vz = -9;
    state.y = FX.HOLDS[i].y + 0.2;
    state.z = FX.faceZ(state.y) - 0.35;
    state.flightT = 0.5;
    state.origin = i;
    snap = true;
  },
};
if (shot) document.body.classList.add("shot");
if (shotName) {
  applyShot(shotName);
  render(0.016);
  syncUI();
}
requestAnimationFrame(frame);
</script>
</body>
</html>
