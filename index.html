<!DOCTYPE html>
<html lang="zh-Hans">
<head>

<title>放下 · Let Go</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2307080c' width='32' height='32'/%3E%3Cpath d='M7 27 L16 5 L25 27' fill='none' stroke='%23f3efe6' stroke-width='1.2'/%3E%3Ccircle cx='16' cy='18' r='1.5' fill='%23c44536'/%3E%3C/svg%3E">
<style>
  :root {
    --paper: #f4efe6;
    --dim: rgba(244, 239, 230, 0.66);
    --cin: #c44536;
    --ink: #090a0e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--ink); color: var(--paper);
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
    font-family: "Iowan Old Style", Palatino, "Palatino Linotype", "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "PMingLiU", "SimSun", "WenQuanYi Micro Hei", serif;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  button {
    pointer-events: auto; background: none; border: 0; color: var(--paper);
    font: inherit; letter-spacing: 0.18em; font-size: 13px; opacity: 0.72;
    padding: 12px 10px; cursor: pointer;
  }
  button:hover, button:focus-visible { opacity: 1; }
  button.off { opacity: 0.32; text-decoration: line-through; }
  #bar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 0 calc(8px + env(safe-area-inset-left));
  }
  #bar .left, #bar .right { display: flex; gap: 2px; }
  #title {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    transition: opacity 0.8s ease;
  }
  #title h1 {
    margin: 0; font-weight: 400; font-size: clamp(92px, 15vh, 168px);
    letter-spacing: 0; line-height: 1; text-shadow: 0 10px 40px rgba(0,0,0,0.35);
  }
  #title h1 span { display: inline-block; margin-left: 0.22em; }
  #sub {
    margin: 0.55em 0 0; font-family: "Gill Sans", "Avenir Next", "Trebuchet MS", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
    letter-spacing: 0.62em; text-indent: 0.62em; font-size: 12px; opacity: 0.72;
  }
  #hint {
    position: absolute; left: 50%; bottom: calc(7vh + env(safe-area-inset-bottom));
    transform: translateX(-50%); width: min(92vw, 440px); text-align: center;
    font-size: 14px; letter-spacing: 0.12em; color: var(--paper);
    text-shadow: 0 2px 12px rgba(0,0,0,0.65); opacity: 0; transition: opacity 0.6s ease;
  }
  #meter {
    position: absolute; right: calc(18px + env(safe-area-inset-right));
    top: 16vh; bottom: 14vh; width: 72px; pointer-events: none;
  }
  #meter .track {
    position: absolute; right: 8px; top: 0; bottom: 0; width: 1px;
    background: linear-gradient(to top, rgba(244,239,230,0.18), rgba(196,69,54,0.85));
  }
  #bestMark {
    position: absolute; right: 4px; width: 9px; height: 1px; background: #e6c27a;
    transform: translateY(50%); opacity: 0.85;
  }
  #nowMark {
    position: absolute; right: 3px; width: 11px; height: 11px; border-radius: 50%;
    border: 1px solid var(--paper); background: var(--cin);
    transform: translateY(50%); box-shadow: 0 0 12px rgba(196,69,54,0.65);
  }
  #alt {
    position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
    font-size: 12px; letter-spacing: 0.08em; white-space: nowrap;
    font-variant-numeric: tabular-nums; text-shadow: 0 1px 6px rgba(0,0,0,0.7);
  }
  #card, #ending {
    position: absolute; left: 50%; transform: translateX(-50%);
    opacity: 0; transition: opacity 0.45s ease; text-align: center;
  }
  #card {
    bottom: calc(11vh + env(safe-area-inset-bottom));
    width: min(86vw, 300px); padding: 18px 18px 14px;
    background: rgba(10, 10, 12, 0.46);
    border: 1px solid rgba(244, 239, 230, 0.16);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  #card.show, #ending.show { opacity: 1; }
  #ending.show { pointer-events: auto; }
  #ring {
    width: 62px; height: 62px; margin: 0 auto 8px; border-radius: 50%;
    background: conic-gradient(var(--cin) calc(var(--p, 0) * 1%), rgba(244,239,230,0.2) 0);
    -webkit-mask: radial-gradient(circle, transparent 57%, #000 59%);
    mask: radial-gradient(circle, transparent 57%, #000 59%);
  }
  #card h2 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 0.14em; }
  #cardLine { margin: 0.55em 0 0.7em; font-size: 14px; letter-spacing: 0.06em; color: var(--dim); }
  #card .how { margin: 0; font-size: 12px; letter-spacing: 0.16em; line-height: 1.9; }
  #ending {
    bottom: calc(8vh + env(safe-area-inset-bottom)); width: min(92vw, 440px);
    text-shadow: 0 2px 16px rgba(0,0,0,0.55);
  }
  #ending p { margin: 0.28em 0; font-size: clamp(16px, 2.1vh, 20px); letter-spacing: 0.08em; line-height: 1.75; }
  #again {
    margin-top: 1.15em; border-bottom: 1px solid rgba(244,239,230,0.45);
    letter-spacing: 0.24em; font-size: 14px; padding: 8px 2px 4px;
  }
  #err {
    position: absolute; left: 12px; right: 12px; bottom: 12px; color: #ffb4a8;
    font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap;
    pointer-events: none; display: none;
  }
  @media (max-aspect-ratio: 4/5) {
    #title h1 { font-size: clamp(84px, 12vh, 132px); }
    #meter { right: calc(10px + env(safe-area-inset-right)); top: 13vh; bottom: 16vh; }
    #hint { font-size: 13px; letter-spacing: 0.08em; }
  }
</style>
</head>
<body>
<canvas id="c" aria-label="放下。按住蓄力，松开飞出。"></canvas>
<div id="ui">
  <div id="bar">
    <div class="left">
      <button id="mute" type="button" aria-label="声音">声</button>
      <button id="lang" type="button">EN</button>
    </div>

      <button id="restart" type="button">重来</button>
    </div>
  </div>
  <header id="title"><h1>放<span>下</span></h1><p id="sub">LET GO</p></header>
  <p id="hint"></p>
  <div id="meter" aria-hidden="true">
    <div class="track"></div>
    <div id="bestMark"></div>
    <div id="nowMark"><b id="alt"></b></div>
  </div>
  <section id="card">
    <div id="ring"></div>

    <p id="e1"></p>

    <p id="e3"></p>
    <button id="again" type="button">再爬一次</button>
  </section>
  <div id="err"></div>
</div>
<script src="game.js"></script>
<script>
"use strict";
const FX = window.Fangxia;
const canvas = document.getElementById("c");
const ui = {
  title: document.getElementById("title"),
  sub: document.getElementById("sub"),
  hint: document.getElementById("hint"),
  mute: document.getElementById("mute"),
  lang: document.getElementById("lang"),
  restart: document.getElementById("restart"),
  card: document.getElementById("card"),
  ring: document.getElementById("ring"),
  cardName: document.getElementById("cardName"),
  cardLine: document.getElementById("cardLine"),
  howHold: document.getElementById("howHold"),
  howTap: document.getElementById("howTap"),
  ending: document.getElementById("ending"),
  e1: document.getElementById("e1"),
  e2: document.getElementById("e2"),
  e3: document.getElementById("e3"),
  again: document.getElementById("again"),
  alt: document.getElementById("alt"),
  now: document.getElementById("nowMark"),
  best: document.getElementById("bestMark"),
  err: document.getElementById("err"),
};

const shot = new URLSearchParams(location.search).has("shot");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const coarse = matchMedia("(pointer: coarse)").matches;

const SAVE_KEY = "fangxia-v1";
function loadSave() {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; }
  catch (e) { return {}; }
}
function writeSave(data) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); }
  catch (e) {}
}
const saved = loadSave();
let lang = saved.lang === "en" ? "en" : "zh";
let muted = !!saved.mute;
let bestSaved = saved.best | 0;

const state = FX.createState();
let holding = false;
let restartPulse = false;
let rush = false;
let snap = false;
let q = shot ? 2 : coarse ? 1 : 2;
let scale = shot ? 1 : coarse ? 0.68 : 0.88;
const frameMs = [];
let prevGrip = null;
let blur = [0, 0];

const cam = {
  pos: [-30, 4, 6],
  look: [-4, 46, 0],
  fov: 0.7,
};

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function mix(a, b, t) { return a + (b - a) * t; }
function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function mul(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function cross(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}
function vlen(a) { return Math.hypot(a[0], a[1], a[2]); }
function norm(a) { const l = vlen(a) || 1; return mul(a, 1 / l); }
function damp(a, b, dt, k) {
  const t = 1 - Math.exp(-k * dt);
  return [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)];
}

const VS = `#version 300 es
void main() {
  vec2 p = vec2(gl_VertexID == 1 ? 3.0 : -1.0, gl_VertexID == 2 ? 3.0 : -1.0);
  gl_Position = vec4(p, 0.0, 1.0);
}`;

const FS = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 uRes;
uniform float uTime, uFov, uDay, uQ, uRope, uPose, uWeight, uArmed, uDotN, uBurst, uFade, uSway;
uniform vec3 uCam, uFwd, uRight, uUp, uSun, uGrip, uHang, uPiton;
uniform vec2 uVel;
uniform vec4 uItems;
uniform vec4 uHolds[8];
uniform vec3 uDots[12];
uniform vec2 uLedge[5];
uniform vec4 uDrop;

float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 345.45));
  p += dot(p, p + 34.345);
  return fract(p.x * p.y);
}
float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 3; i++) {
    v += a * noise(p);
    p = p * 2.03 + vec2(1.7, 9.2);
    a *= 0.5;
  }
  return v;
}
float fbm2(vec2 p) {
  return noise(p) * 0.65 + noise(p * 2.1 + 3.0) * 0.35;
}
void radii(float y, out float rx, out float rz) {
  float k = clamp(y / 110.0, 0.0, 1.0);
  rx = mix(7.2, 3.4, k) + sin(y * 0.07 + 0.6) * 0.28;
  rz = mix(16.0, 8.0, k) + sin(y * 0.05) * 1.1;
}
float faceX(float y, float z) {
  float rx, rz;
  radii(y, rx, rz);
  float zz = clamp(z / rz, -0.96, 0.96);
  return -rx * sqrt(max(0.0, 1.0 - zz * zz));
}
float hitEllipse(vec3 ro, vec3 rd, vec3 c, float rx, float rz, float y0, float y1, out vec3 n) {
  vec3 o = ro - c;
  float invx = 1.0 / (rx * rx);
  float invz = 1.0 / (rz * rz);
  float A = rd.x * rd.x * invx + rd.z * rd.z * invz;
  float B = 2.0 * (o.x * rd.x * invx + o.z * rd.z * invz);
  float C = o.x * o.x * invx + o.z * o.z * invz - 1.0;
  float disc = B * B - 4.0 * A * C;
  n = vec3(0.0, 1.0, 0.0);
  if (disc < 0.0 || A < 1e-6) return -1.0;
  float s = sqrt(disc);
  float t1 = (-B - s) / (2.0 * A);
  float t2 = (-B + s) / (2.0 * A);
  float ts[2] = float[2](t1, t2);
  for (int i = 0; i < 2; i++) {
    float t = ts[i];
    if (t < 0.03) continue;
    vec3 p = ro + rd * t;
    if (p.y <= y1 && p.y >= y0) {
      n = normalize(vec3((p.x - c.x) * invx, 0.0, (p.z - c.z) * invz));
      return t;
    }
  }
  if (abs(rd.y) > 1e-4) {
    for (int k = 0; k < 2; k++) {
      float yc = k == 0 ? y1 : y0;
      float tc = (yc - ro.y) / rd.y;
      if (tc < 0.03) continue;
      vec3 p = ro + rd * tc;
      vec3 d = p - c;
      if (d.x * d.x * invx + d.z * d.z * invz < 1.0) {
        n = vec3(0.0, k == 0 ? 1.0 : -1.0, 0.0);
        return tc;
      }
    }
  }
  return -1.0;
}
float hitCliff(vec3 ro, vec3 rd, out vec3 n) {
  float best = 1e9;
  n = vec3(0.0, 1.0, 0.0);
  float seed = 8.0;
  for (int s = 0; s < 3; s++) {
    float t = seed;
    seed += 14.0;
    vec3 nn = vec3(0.0, 1.0, 0.0);
    bool ok = true;
    for (int i = 0; i < 2; i++) {
      float y = clamp(ro.y + rd.y * t, -20.0, 106.0);
      float rx, rz;
      radii(y, rx, rz);
      float ht = hitEllipse(ro, rd, vec3(0.0), rx, rz, -40.0, 107.2, nn);
      if (ht < 0.0) { ok = false; break; }
      t = ht;
    }
    if (ok && t > 0.03 && t < best) { best = t; n = nn; }
  }
  return best < 1e8 ? best : -1.0;
}
float hitBox(vec3 ro, vec3 rd, vec3 bmin, vec3 bmax, out vec3 n) {
  vec3 inv = sign(rd) / max(abs(rd), vec3(1e-5));
  vec3 t0s = (bmin - ro) * inv;
  vec3 t1s = (bmax - ro) * inv;
  vec3 tsm = min(t0s, t1s);
  vec3 tbg = max(t0s, t1s);
  float t0 = max(max(tsm.x, tsm.y), tsm.z);
  float t1 = min(min(tbg.x, tbg.y), tbg.z);
  n = vec3(0.0, 1.0, 0.0);
  if (t1 < max(t0, 0.02)) return -1.0;
  float t = t0 > 0.02 ? t0 : t1;
  vec3 p = ro + rd * t;
  vec3 c = (bmin + bmax) * 0.5;
  vec3 e = max((bmax - bmin) * 0.5, vec3(0.001));
  vec3 q = abs(p - c) / e;
  if (q.y >= q.x && q.y >= q.z) n = vec3(0.0, sign(p.y - c.y), 0.0);
  else if (q.x >= q.z) n = vec3(sign(p.x - c.x), 0.0, 0.0);
  else n = vec3(0.0, 0.0, sign(p.z - c.z));
  return t;
}
vec3 sunCol() {
  return mix(vec3(0.85, 0.88, 0.95), vec3(1.05, 0.72, 0.42), smoothstep(0.25, 0.95, uDay));
}
vec3 sky(vec3 rd) {
  float h = rd.y;
  float day = clamp(uDay, 0.0, 1.0);
  vec3 zen = mix(vec3(0.025, 0.04, 0.09), vec3(0.18, 0.42, 0.78), day);
  vec3 hor = mix(vec3(0.22, 0.24, 0.34), vec3(1.02, 0.55, 0.30), pow(day, 0.72));
  vec3 down = mix(vec3(0.05, 0.055, 0.07), vec3(0.55, 0.48, 0.46), day);
  vec3 col = mix(hor, zen, smoothstep(-0.02, 0.62, h));
  col = mix(down, col, smoothstep(-0.28, 0.06, h));
  float sd = max(dot(rd, normalize(uSun)), 0.0);
  vec3 sc = sunCol();
  col += sc * pow(sd, 3.0) * 0.55;
  col += sc * pow(sd, 14.0) * 0.7;
  col += sc * pow(sd, 220.0) * 4.0;
  vec2 sp = rd.xz / (abs(rd.y) + 0.45) * 28.0;
  vec2 sid = floor(sp);
  vec2 sf = fract(sp) - 0.5;
  float sn = hash21(sid);
  float star = smoothstep(0.045, 0.0, length(sf)) * step(0.965, sn);
  col += star * (1.0 - smoothstep(0.45, 0.8, day)) * smoothstep(0.05, 0.35, h) * 0.85;
  float cir = fbm(rd.xz / (abs(rd.y) + 0.35) * 1.4 + vec2(uTime * 0.008, 0.2));
  col = mix(col, vec3(1.0, 0.96, 0.92), smoothstep(0.58, 0.86, cir) * smoothstep(0.0, 0.4, h) * 0.16 * day);
  return col;
}
float cloudDen(vec3 p, vec3 ro) {
  float h = clamp((p.y - 50.0) / 48.0, 0.0, 1.0);
  float profile = smoothstep(0.0, 0.18, h) * smoothstep(1.0, 0.42, h);
  float summit = smoothstep(96.0, 112.0, p.y) * smoothstep(130.0, 108.0, p.y);
  float n = fbm2(p.xz * 0.05 + vec2(p.y * 0.015, uTime * 0.012));
  float d = smoothstep(0.48, 0.78, n) * profile + summit * smoothstep(0.55, 0.8, n) * 0.45;
  float dist = length(p - ro);
  d *= smoothstep(5.5, 14.0, dist);
  return d;
}
vec3 shadeRock(vec3 p, vec3 n, vec3 rd) {
  vec2 uv = vec2(p.y * 0.21, p.z * 0.21);
  float h = fbm(uv);
  float groove = noise(vec2(p.y * 0.35, p.z * 1.7));
  float crack = noise(vec2(p.y * 1.3, p.z * 3.2));
  vec3 n2 = normalize(n + vec3((crack - 0.5) * 0.1, (h - 0.5) * 0.05, (groove - 0.5) * 0.12));
  float snow = smoothstep(0.05, 0.55, n2.y + (groove - 0.35) * 0.45);
  float alt = smoothstep(42.0, 100.0, p.y);
  snow = clamp(max(snow, alt * smoothstep(-0.2, 0.45, n2.y) * 0.85), 0.0, 1.0);
  vec3 rock = mix(vec3(0.16, 0.18, 0.24), vec3(0.38, 0.4, 0.44), h);
  rock = mix(rock, vec3(0.22, 0.16, 0.14), smoothstep(0.62, 0.9, crack) * 0.55);
  rock *= 0.88 + 0.12 * groove;
  vec3 sn = vec3(0.86, 0.9, 0.95);
  vec3 albedo = mix(rock, sn, snow);
  float band = 0.0;
  for (int i = 0; i < 5; i++) {
    float dy = abs(p.y - uLedge[i].x);
    float dz = abs(p.z - uLedge[i].y);
    band = max(band, (1.0 - smoothstep(0.08, 0.42, dy)) * (1.0 - smoothstep(0.2, 1.35, dz)));
  }
  albedo = mix(albedo, vec3(0.92, 0.94, 0.97), band);
  vec3 sc = sunCol();
  vec3 skyA = mix(vec3(0.25, 0.32, 0.48), vec3(0.5, 0.64, 0.82), uDay);
  float ndl = dot(n2, normalize(uSun));
  float diff = clamp(ndl, 0.0, 1.0);
  float wrap = clamp(ndl * 0.5 + 0.5, 0.0, 1.0);
  float ao = clamp(0.42 + 0.58 * groove, 0.3, 1.0);
  ao *= 0.6 + 0.4 * smoothstep(-0.45, 0.7, n2.y);
  vec3 col = albedo * (skyA * (0.38 + wrap * 0.4) + sc * diff * 1.25) * ao;
  col += band * sc * 0.45;
  float rim = pow(1.0 - max(dot(n2, -rd), 0.0), 2.6);
  col += rim * mix(vec3(0.45, 0.55, 0.75), sc, uDay) * 0.35;
  float edge = pow(1.0 - max(dot(normalize(n), -rd), 0.0), 2.2);
  col += edge * sc * 0.18;
  float spec = pow(max(dot(reflect(-normalize(uSun), n2), -rd), 0.0), 48.0) * snow;
  col += spec * sc * 0.65;
  float glint = pow(noise(p.yz * 5.0 + uTime * 0.02), 28.0) * snow * diff;
  col += glint * sc * 0.12;
  vec2 sd = p.yz - uGrip.yz;
  float sh = exp(-dot(sd, sd) * 0.22);
  col *= 1.0 - sh * 0.34;
  if (uBurst > 0.01) {
    float ring = exp(-abs(length(sd) - (1.0 - uBurst) * 1.6) * 6.0);
    col += vec3(0.85, 0.9, 1.0) * ring * uBurst * 0.55;
  }
  return col;
}

let acc = 0;
let last = 0;
let frames = 0;
let readyResolve;
const ready = new Promise((r) => { readyResolve = r; });
let readySent = false;

function frame(now) {
  try {
  if (!last) last = now;
  const raw = Math.min(0.05, Math.max(0.0, (now - last) / 1000));
  last = now;
  frameMs.push(raw);
  if (frameMs.length > 40) frameMs.shift();
  frames++;
  if (!shot && frames % 50 === 0 && frameMs.length > 20) {
    const avg = frameMs.reduce((a, b) => a + b, 0) / frameMs.length;
    if (avg > 0.022) {
      if (scale > 0.45) scale = Math.max(0.45, scale * 0.88);
      else if (q > 0) q -= 1;
    } else if (avg < 0.014 && scale < (coarse ? 0.85 : 1)) {
      scale = Math.min(coarse ? 0.85 : 1, scale * 1.05);
    }
  }
  acc += raw;
  const sounds = [];
  const input = { holding, restart: restartPulse, skipIntro: rush || reduce, freezeIntro: false };
  restartPulse = false;
  let n = 0;
  while (acc >= 1 / 120 && n < 6) {
    FX.step(state, 1 / 120, input);
    if (state.sfx && state.sfx.length) sounds.push.apply(sounds, state.sfx);
    acc -= 1 / 120;
    n++;
    input.restart = false;
    input.skipIntro = rush || reduce;
  }
  const peak = Math.round(state.bestRun);
  if (peak > bestSaved) {
    bestSaved = peak;
    writeSave({ best: bestSaved, mute: muted, lang });
    tone(587, 0.35, "sine", 0.03);
  }
  playSfx(sounds);
  const alt = state.attached ? FX.HOLDS[state.holdIndex].y : state.y;
  music(raw, alt, state.mode);
  render(raw);
  syncUI();
  if (!readySent && state.time > 0.05) {
    readySent = true;
    readyResolve(true);
  }
  } catch (err) {
    console.error("frame", err && err.stack || err);
    if (!readySent) { readySent = true; readyResolve(false); }
  }
  requestAnimationFrame(frame);
}

  syncUI();
}
ui.lang.addEventListener("click", toggleLang);
function fullRestart() { restartPulse = true; rush = true; unlock(); }
ui.restart.addEventListener("click", fullRestart);
ui.again.addEventListener("click", fullRestart);
setMuted(muted);
syncUI();
requestAnimationFrame(frame);

window.__fx = {
  ready,
  get q() { return q; },
  get scale() { return scale; },
  state() {
    return {
      mode: state.mode, y: state.y, z: state.z, mask: state.mask, hold: state.holdIndex,
      catches: state.catches, falls: state.falls, intro: state.intro, attached: state.attached,
      endingT: state.endingT, time: state.time,
    };
  },
  teleport(i) {
    const h = FX.HOLDS[i];
    state.holdIndex = i;
    state.attached = true;
    state.mode = "play";
    state.settle = 1;
    state.holdT = 0;
    state.intro = 0;
    state.vy = 0;
    state.vz = 0;
    state.angle = 0;
    state.visAngle = 0;
    state.y = h.y - FX.L;
    state.z = h.z;
    state.origin = i;
    state.flightT = 0;
    state.dots = [];
    state.catches = 6;
    state.launches = 4;
    snap = true;
  },
  mask(m) { state.mask = m; },
  fallFrom(i) {
    this.teleport(i);
    const h = FX.HOLDS[i];
    state.attached = false;
    state.mode = "play";
    state.vy = -18;
    state.vz = 1.2;
    state.y = h.y - 4.2;
    state.z = h.z + 1.6;
    state.flightT = 0.55;
    state.origin = i;
    state.angle = Math.atan2(-state.vz, state.vy);
    state.visAngle = state.angle;
    snap = true;
  },
  ending(mask) {
    this.teleport(FX.HOLDS.length - 1);
    state.mask = mask;
    state.mode = "ending";
    state.endingT = 2.2;
    const h = FX.HOLDS[state.holdIndex];
    state.y = h.y + 0.22;
    state.z = h.z;
    snap = true;
  },
  errors() { return ui.err.textContent; },
};
</script>
