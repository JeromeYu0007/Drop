<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2307080c' width='32' height='32'/%3E%3Cpath d='M7 27 L16 5 L25 27' fill='none' stroke='%23f3efe6' stroke-width='1.2'/%3E%3Ccircle cx='16' cy='18' r='1.5' fill='%23c44536'/%3E%3C/svg%3E">
<style>
  :root {
    --paper: #f4efe6;
    --dim: rgba(244, 239, 230, 0.66);
    --cin: #c44536;
    --ink: #090a0e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--ink); color: var(--paper);
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
    font-family: "Iowan Old Style", Palatino, "Palatino Linotype", "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "PMingLiU", "SimSun", "WenQuanYi Micro Hei", serif;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  button {

  #bar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 0 calc(8px + env(safe-area-inset-left));
  }
  #bar .left, #bar .right { display: flex; gap: 2px; }
  #title {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;

  }
  #title h1 {
    margin: 0; font-weight: 400; font-size: clamp(92px, 15vh, 168px);

  }
  #title h1 span { display: inline-block; margin-left: 0.22em; }
  #sub {
    margin: 0.55em 0 0; font-family: "Gill Sans", "Avenir Next", "Trebuchet MS", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
    letter-spacing: 0.62em; text-indent: 0.62em; font-size: 12px; opacity: 0.72;

  #meter {

    top: 16vh; bottom: 14vh; width: 72px; pointer-events: none;
  }
  #meter .track {
    position: absolute; right: 8px; top: 0; bottom: 0; width: 1px;

  }
  #bestMark {
    position: absolute; right: 4px; width: 9px; height: 1px; background: #e6c27a;
    transform: translateY(50%); opacity: 0.85;
  }
  #nowMark {
    position: absolute; right: 3px; width: 11px; height: 11px; border-radius: 50%;
    border: 1px solid var(--paper); background: var(--cin);
    transform: translateY(50%); box-shadow: 0 0 12px rgba(196,69,54,0.65);
  }
  #alt {

  #card, #ending {

  }
  #card {
    bottom: calc(11vh + env(safe-area-inset-bottom));
    width: min(86vw, 300px); padding: 18px 18px 14px;
    background: rgba(10, 10, 12, 0.46);

  }
  #card.show, #ending.show { opacity: 1; }
  #ending.show { pointer-events: auto; }
  #ring {
    width: 62px; height: 62px; margin: 0 auto 8px; border-radius: 50%;
    background: conic-gradient(var(--cin) calc(var(--p, 0) * 1%), rgba(244,239,230,0.2) 0);
    -webkit-mask: radial-gradient(circle, transparent 57%, #000 59%);
    mask: radial-gradient(circle, transparent 57%, #000 59%);
  }
  #card h2 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 0.14em; }
  #cardLine { margin: 0.55em 0 0.7em; font-size: 14px; letter-spacing: 0.06em; color: var(--dim); }
  #card .how { margin: 0; font-size: 12px; letter-spacing: 0.16em; line-height: 1.9; }
  #ending {
    bottom: calc(8vh + env(safe-area-inset-bottom)); width: min(92vw, 440px);
    text-shadow: 0 2px 16px rgba(0,0,0,0.55);
  }
  #ending p { margin: 0.28em 0; font-size: clamp(16px, 2.1vh, 20px); letter-spacing: 0.08em; line-height: 1.75; }
  #again {
    margin-top: 1.15em; border-bottom: 1px solid rgba(244,239,230,0.45);
    letter-spacing: 0.24em; font-size: 14px; padding: 8px 2px 4px;
  }
  #err {
    position: absolute; left: 12px; right: 12px; bottom: 12px; color: #ffb4a8;
    font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap;
    pointer-events: none; display: none;
  }
  @media (max-aspect-ratio: 4/5) {
    #title h1 { font-size: clamp(84px, 12vh, 132px); }
    #meter { right: calc(10px + env(safe-area-inset-right)); top: 13vh; bottom: 16vh; }

<body>
<canvas id="c" aria-label="放下。按住蓄力，松开飞出。"></canvas>
<div id="ui">
  <div id="bar">

</div>
<script src="game.js"></script>
<script>
"use strict";
const FX = window.Fangxia;
const canvas = document.getElementById("c");
const ui = {
  title: document.getElementById("title"),
  sub: document.getElementById("sub"),
  hint: document.getElementById("hint"),
  mute: document.getElementById("mute"),
  lang: document.getElementById("lang"),
  restart: document.getElementById("restart"),
  card: document.getElementById("card"),
  ring: document.getElementById("ring"),
  cardName: document.getElementById("cardName"),
  cardLine: document.getElementById("cardLine"),
  howHold: document.getElementById("howHold"),
  howTap: document.getElementById("howTap"),
  ending: document.getElementById("ending"),
  e1: document.getElementById("e1"),
  e2: document.getElementById("e2"),
  e3: document.getElementById("e3"),
  again: document.getElementById("again"),
  alt: document.getElementById("alt"),
  now: document.getElementById("nowMark"),
  best: document.getElementById("bestMark"),
  err: document.getElementById("err"),
};

const shot = new URLSearchParams(location.search).has("shot");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const coarse = matchMedia("(pointer: coarse)").matches;

const SAVE_KEY = "fangxia-v1";
function loadSave() {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; }
  catch (e) { return {}; }
}
function writeSave(data) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); }
  catch (e) {}
}
const saved = loadSave();
let lang = saved.lang === "en" ? "en" : "zh";
let muted = !!saved.mute;
let bestSaved = saved.best | 0;

const state = FX.createState();
let holding = false;
let restartPulse = false;
let rush = false;
let snap = false;
let q = shot ? 2 : coarse ? 1 : 2;
let scale = shot ? 1 : coarse ? 0.68 : 0.88;
const frameMs = [];
let prevGrip = null;
let blur = [0, 0];

const cam = {
  pos: [-30, 4, 6],
  look: [-4, 46, 0],
  fov: 0.7,
};

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function mix(a, b, t) { return a + (b - a) * t; }
function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function mul(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function cross(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}
function vlen(a) { return Math.hypot(a[0], a[1], a[2]); }
function norm(a) { const l = vlen(a) || 1; return mul(a, 1 / l); }
function damp(a, b, dt, k) {
  const t = 1 - Math.exp(-k * dt);
  return [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)];
}

const VS = `#version 300 es
void main() {
  vec2 p = vec2(gl_VertexID == 1 ? 3.0 : -1.0, gl_VertexID == 2 ? 3.0 : -1.0);
  gl_Position = vec4(p, 0.0, 1.0);
}`;

const FS = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 uRes;
uniform float uTime, uFov, uDay, uQ, uRope, uPose, uWeight, uArmed, uDotN, uBurst, uSway;
uniform vec3 uCam, uFwd, uRight, uUp, uSun, uGrip, uHang, uPiton;
uniform vec2 uVel;
uniform vec4 uItems;
uniform vec4 uHolds[8];
uniform vec3 uDots[12];
uniform vec4 uDrop;

float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 345.45));
  p += dot(p, p + 34.345);
  return fract(p.x * p.y);
}
float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
float ridge(vec2 p) {
  float a = 1.0 - abs(noise(p) * 2.0 - 1.0);
  float b = 1.0 - abs(noise(p * 2.15 + 5.2) * 2.0 - 1.0);
  return a * 0.62 + b * 0.38;
}
void radii(float y, out float rx, out float rz) {
  float k = clamp((y + 6.0) / 124.0, 0.0, 1.0);
  float s = k * k * (3.0 - 2.0 * k);
  rx = mix(11.2, 1.45, s) + sin(y * 0.055) * 1.15 + sin(y * 0.16 + 1.2) * 0.35;
  rz = mix(15.8, 2.7, s) + sin(y * 0.047 + 0.8) * 1.35;
}
float faceX(float y, float z) {
  float rx, rz;
  radii(y, rx, rz);
  float zz = clamp(z / rz, -0.96, 0.96);
  return -rx * sqrt(max(0.0, 1.0 - zz * zz));
}
float rockSDF(vec3 p) {
  float rx, rz;
  radii(p.y, rx, rz);
  float rg = ridge(vec2(p.y * 0.09, p.z * 0.11));
  rx += rg * 0.85;
  rz += rg * 0.45;
  vec2 e = vec2(p.x / rx, p.z / rz);
  float d = (length(e) - 1.0) * min(rx, rz);
  d = max(d, p.y - 116.0);
  return d;
}
float peakSDF(vec3 p, vec3 c, float rad, float hgt) {
  vec3 q = p - c;
  float k = clamp(q.y / hgt, 0.0, 1.0);
  float r = mix(rad, rad * 0.08, k * k);
  float d = length(q.xz) - r;
  d = max(d, q.y - hgt);
  d = max(d, -q.y - 8.0);
  return d;
}
vec3 sunCol() {
  return mix(vec3(1.0, 0.93, 0.82), vec3(1.0, 0.84, 0.62), smoothstep(0.15, 0.8, uDay));
}
vec3 sky(vec3 rd) {
  float h = rd.y;
  float day = clamp(uDay, 0.0, 1.0);
  vec3 zen = mix(vec3(0.10, 0.22, 0.48), vec3(0.28, 0.55, 0.86), day);
  vec3 hor = mix(vec3(0.96, 0.58, 0.36), vec3(1.0, 0.78, 0.55), pow(day, 0.7));
  vec3 ground = mix(vec3(0.16, 0.18, 0.24), vec3(0.62, 0.5, 0.42), day);
  vec3 col = mix(hor, zen, smoothstep(-0.02, 0.48, h));
  col = mix(ground, col, smoothstep(-0.35, 0.02, h));
  float sd = max(dot(rd, normalize(uSun)), 0.0);
  vec3 sc = sunCol();
  col += sc * pow(sd, 4.0) * 0.55;
  col += sc * pow(sd, 18.0) * 0.85;
  col += sc * pow(sd, 280.0) * 6.0;
  vec2 sp = rd.xz / (abs(rd.y) + 0.5) * 36.0;
  vec2 id = floor(sp);
  vec2 f = fract(sp) - 0.5;
  float n = hash21(id);
  float star = smoothstep(0.04, 0.0, length(f)) * step(0.972, n);
  col += star * (1.0 - smoothstep(0.42, 0.78, day)) * smoothstep(0.02, 0.3, h);
  return col;
}
float cloudN(vec3 p) {
  vec2 q = p.xz * 0.035 + vec2(p.y * 0.01, uTime * 0.012);
  return noise(q) * 0.65 + noise(q * 2.05 + 4.0) * 0.35;
}
float cloudDen(vec3 p, vec3 ro) {
  float h = clamp((p.y - 2.0) / 34.0, 0.0, 1.0);
  float profile = smoothstep(0.0, 0.22, h) * smoothstep(1.0, 0.45, h);
  float n = cloudN(p);
  float d = smoothstep(0.38, 0.68, n) * profile * 1.35;
  d *= smoothstep(7.0, 18.0, length(p - ro));
  return d;
}
vec3 shadeRock(vec3 p, vec3 n, vec3 rd, float snowBias) {
  vec2 uv = p.yz * 0.42;
  float rg = ridge(uv);
  float rgx = ridge(uv + vec2(0.08, 0.0));
  float rgz = ridge(uv + vec2(0.0, 0.08));
  vec3 n2 = normalize(n + vec3(0.0, (rg - rgx) * 0.12, (rg - rgz) * 0.12));
  float grit = noise(p.yz * 0.18);
  vec3 rock = mix(vec3(0.30, 0.36, 0.46), vec3(0.52, 0.50, 0.48), grit);
  float snowN = smoothstep(0.5, 0.85, n.y);
  float snowH = smoothstep(50.0, 86.0, p.y);
  float snow = clamp(max(max(snowN, snowH), snowBias), 0.0, 1.0);
  vec3 sn = mix(vec3(0.73, 0.8, 0.9), vec3(1.0, 0.98, 0.96), clamp(dot(n, normalize(uSun)) * 0.6 + 0.45, 0.0, 1.0));
  vec3 albedo = mix(rock, sn, snow);
  vec3 sc = sunCol();
  vec3 skyA = vec3(0.42, 0.55, 0.78);
  float ndl = dot(n2, normalize(uSun));
  float key = smoothstep(-0.05, 0.55, ndl);
  float rim = pow(1.0 - max(dot(n2, -rd), 0.0), 3.0);
  vec3 col = mix(albedo * skyA, albedo * sc, key);
  col += rim * sc * 0.7;
  col += pow(max(dot(reflect(-normalize(uSun), n2), -rd), 0.0), 36.0) * snow * sc * 0.35;
  return col;
}
float hitEll(vec3 ro, vec3 rd, vec3 c, float rx, float rz, float y0, float y1, out vec3 n) {
  vec3 o = ro - c;
  float ix = 1.0 / (rx * rx);
  float iz = 1.0 / (rz * rz);
  float A = rd.x * rd.x * ix + rd.z * rd.z * iz;
  float B = 2.0 * (o.x * rd.x * ix + o.z * rd.z * iz);
  float C = o.x * o.x * ix + o.z * o.z * iz - 1.0;
  float disc = B * B - 4.0 * A * C;
  n = vec3(0.0, 1.0, 0.0);
  if (disc < 0.0 || A < 1e-5) return -1.0;
  float s = sqrt(disc);
  float tA = (-B - s) / (2.0 * A);
  float tB = (-B + s) / (2.0 * A);
  for (int i = 0; i < 2; i++) {
    float t = i == 0 ? tA : tB;
    if (t < 0.04) continue;
    vec3 p = ro + rd * t;
    if (p.y >= y0 && p.y <= y1) {
      n = normalize(vec3((p.x - c.x) * ix, 0.0, (p.z - c.z) * iz));
      return t;
    }
  }
  if (abs(rd.y) > 1e-4) {
    float tc = (y1 - ro.y) / rd.y;
    if (tc > 0.04) {
      vec3 p = ro + rd * tc;
      vec3 d = p - c;
      if (d.x * d.x * ix + d.z * d.z * iz < 1.0) {
        n = vec3(0.0, 1.0, 0.0);
        return tc;
      }
    }
  }
  return -1.0;
}
float marchRock(vec3 ro, vec3 rd, float t0, out vec3 n) {
  float t = max(t0 - 1.6, 0.05);
  float best = -1.0;
  for (int i = 0; i < 16; i++) {
    if (uQ < 0.5 && i >= 8) break;
    vec3 p = ro + rd * t;
    float d = rockSDF(p);
    if (d < 0.045) { best = t; break; }
    t += max(d * 0.65, 0.03);
    if (t > t0 + 2.4) break;
  }
  if (best < 0.0) best = t0;
  vec3 p = ro + rd * best;
  vec2 e = vec2(0.08, 0.0);
  n = normalize(vec3(
    rockSDF(p + e.xyy) - rockSDF(p - e.xyy),
    rockSDF(p + e.yxy) - rockSDF(p - e.yxy),
    rockSDF(p + e.yyx) - rockSDF(p - e.yyx)
  ));
  return best;
}
float rSphere(vec3 ro, vec3 rd, vec3 c, float r, out vec3 n) {
  vec3 oc = ro - c;
  float b = dot(oc, rd);
  float h = b * b - dot(oc, oc) + r * r;
  if (h < 0.0) return -1.0;
  float t = -b - sqrt(h);
  if (t < 0.002) return -1.0;
  n = normalize(oc + rd * t);
  return t;
}
float rEllipsoid(vec3 ro, vec3 rd, vec3 c, vec3 r, out vec3 n) {
  vec3 oc = (ro - c) / r;
  vec3 d = rd / r;
  float A = dot(d, d);
  float B = 2.0 * dot(oc, d);
  float C = dot(oc, oc) - 1.0;
  float h = B * B - 4.0 * A * C;
  if (h < 0.0) return -1.0;
  float t = (-B - sqrt(h)) / (2.0 * A);
  if (t < 0.002) return -1.0;
  n = normalize((ro + rd * t - c) / (r * r));
  return t;
}
vec3 seg(vec3 ro, vec3 rd, vec3 a, vec3 b) {
  vec3 v = b - a;
  vec3 w = ro - a;
  float A = dot(rd, rd);
  float B = dot(rd, v);
  float C = dot(v, v);
  float D = dot(rd, w);
  float E = dot(v, w);
  float den = A * C - B * B;
  float sc, tc;
  if (den < 1e-5) { sc = 0.0; tc = clamp(E / max(C, 1e-5), 0.0, 1.0); }
  else {
    sc = (B * E - C * D) / den;
    tc = (A * E - B * D) / den;
    if (tc < 0.0) { tc = 0.0; sc = clamp(-D / A, 0.0, 1e4); }
    else if (tc > 1.0) { tc = 1.0; sc = clamp((B - D) / A, 0.0, 1e4); }
  }
  sc = max(sc, 0.0);
  return vec3(sc, tc, length((ro + rd * sc) - (a + v * tc)));
}
bool take(float t, vec3 n, vec3 alb, float em, float kind, inout float bt, inout vec3 bn, inout vec3 ba, inout float be, inout float bk) {
  if (t > 0.002 && t < bt) { bt = t; bn = n; ba = alb; be = em; bk = kind; return true; }
  return false;
}
void limb(vec3 ro, vec3 rd, vec3 a, vec3 b, float rad, vec3 alb, float em, inout float bt, inout vec3 bn, inout vec3 ba, inout float be, inout float bk) {
  vec3 h = seg(ro, rd, a, b);
  if (h.z < rad) {
    vec3 p = ro + rd * h.x;
    vec3 q = mix(a, b, h.y);
    take(h.x, normalize(p - q), alb, em, 1.0, bt, bn, ba, be, bk);

  src.connect(filter).connect(wind).connect(master);
  src.start();
  audio.wind = wind; audio.filter = filter;
  const o1 = ctx.createOscillator();
  const o2 = ctx.createOscillator();
  const g = ctx.createGain();
  o1.type = "sine"; o2.type = "sine";
  o1.frequency.value = 98; o2.frequency.value = 146.8;
  g.gain.value = 0.0;
  o1.connect(g); o2.connect(g); g.connect(master);
  o1.start(); o2.start();
  audio.drone = { o1, o2, g };
}
function setMuted(v) {
  muted = v;
  if (audio.master) audio.master.gain.value = muted ? 0 : 0.85;
  writeSave({ best: bestSaved, mute: muted, lang });
  ui.mute.classList.toggle("off", muted);
}
function tone(freq, dur, type, vol, slide) {
  if (!audio.ctx || muted) return;
  const t = audio.ctx.currentTime;
  const o = audio.ctx.createOscillator();
  const g = audio.ctx.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.master);
  o.start(t); o.stop(t + dur + 0.03);
}
function noiseBurst(dur, vol, from, to) {
  if (!audio.ctx || muted) return;
  const ctx = audio.ctx;
  const n = Math.floor(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const d = buf.getChannelData(0);
  let b = 0;
  for (let i = 0; i < n; i++) { b = b * 0.6 + (Math.random() * 2 - 1) * 0.4; d[i] = b; }
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const f = ctx.createBiquadFilter();
  f.type = "bandpass";
  const t = ctx.currentTime;
  f.frequency.setValueAtTime(from, t);
  f.frequency.exponentialRampToValueAtTime(to, t + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(audio.master);
  src.start(t); src.stop(t + dur + 0.02);
}
const SCALE = [196, 220, 247, 294, 330, 392, 440, 494];
function playSfx(list) {
  for (const s of list) {
    if (s === "release") noiseBurst(0.28, 0.08, 900, 220);
    else if (s === "catch") { tone(174.6, 0.22, "sine", 0.05); tone(349.2, 0.4, "triangle", 0.035); }
    else if (s === "arm") tone(740, 0.05, "sine", 0.02);
    else if (s === "near") tone(880, 0.35, "sine", 0.03, 420);
    else if (s === "drop") { tone(523.25, 1.4, "sine", 0.06); tone(784, 1.6, "triangle", 0.03); }
    else if (s === "summit") { tone(392, 1.2, "sine", 0.05); tone(494, 1.5, "sine", 0.04, 0); tone(587, 1.8, "triangle", 0.035); }
    else if (s === "impact") noiseBurst(0.4, 0.12, 180, 60);
    else if (s === "ledge") tone(311, 0.4, "sine", 0.03);
  }
}
function music(dt, alt, mode) {
  if (!audio.ctx || muted || !audio.drone) return;
  const sp = Math.hypot(state.vz, state.vy);
  const target = clamp(0.035 + sp * 0.004 + (mode === "impact" ? 0.08 : 0) + Math.max(0, -state.vy) * 0.002, 0, 0.2);
  audio.wind.gain.setTargetAtTime(target, audio.ctx.currentTime, 0.15);
  audio.filter.frequency.setTargetAtTime(420 + sp * 18 + Math.max(0, -state.vy) * 12, audio.ctx.currentTime, 0.2);
  const climb = clamp((alt - 6) / 100, 0, 1);
  audio.drone.o1.frequency.setTargetAtTime(mix(82, 130.8, climb), audio.ctx.currentTime, 0.4);
  audio.drone.g.gain.setTargetAtTime(mode === "ending" ? 0.03 : 0.012, audio.ctx.currentTime, 0.5);
  if (state.time > audio.nextNote && mode === "play") {
    const idx = (Math.floor(alt / 9) + Math.floor(state.time * 0.2)) % SCALE.length;
    tone(SCALE[idx], 1.6, "triangle", 0.02);
    audio.nextNote = state.time + 2.6 + (Math.sin(state.time * 0.3) * 0.5 + 0.5) * 1.8;
  }
}

function desiredCam(aspect) {
  const standing = state.mode === "ledge" || state.mode === "drop" || state.mode === "ending";
  const y = state.y;
  const z = state.z;
  const fx = FX.faceX(y, z);
  const portrait = aspect < 0.92;
  const fall = clamp((-state.vy - 4) / 14, 0, 1);
  let close;
  if (state.mode === "ending") {
    close = {
      pos: [fx - (portrait ? 8.5 : 12.5), y + 4.2, z + (portrait ? 2.4 : 6.5)],
      look: [fx + 0.4, y + 1.15, z - 0.4],
      fov: (portrait ? 42 : 32) * Math.PI / 180,
    };
  } else {
    const dist = (portrait ? 9.2 : 12.4) + fall * (portrait ? 4.0 : 7.0);
    const side = portrait ? 2.2 : 4.8;
    close = {
      pos: [fx - dist, y + (portrait ? 0.8 : 1.3) + fall * 2.6, z + side],
      look: [fx + 0.8, y + mix(portrait ? 1.5 : 1.7, -2.2, fall), z - 0.2],
      fov: ((portrait ? 44 : 32) + fall * 7) * Math.PI / 180,
    };
  }
  const wide = {
    pos: [-46, 38, 34],
    look: [-1, 58, -2],
    fov: portrait ? 0.9 : 0.72,
  };
  const t = smooth(1 - state.intro);
  return {
    pos: [
      mix(wide.pos[0], close.pos[0], t),
      mix(wide.pos[1], close.pos[1], t),
      mix(wide.pos[2], close.pos[2], t),
    ],
    look: [
      mix(wide.look[0], close.look[0], t),
      mix(wide.look[1], close.look[1], t),
      mix(wide.look[2], close.look[2], t),
    ],
    fov: mix(wide.fov, close.fov, t),
  };
}

function gripOf() {
  const standing = state.mode === "ledge" || state.mode === "drop" || state.mode === "ending";
  if (standing) {
    return [FX.faceX(state.y, state.z) - 1.35, state.y, state.z];
  }
  return [FX.faceX(state.y, state.z) - 1.75, state.y, state.z];
}

const holdBuf = new Float32Array(8 * 4);
const dotBuf = new Float32Array(12 * 3);
const ledgeBuf = new Float32Array(5 * 2);
(function fillLedges() {
  const keys = ["trophy", "letter", "ring", "photo", "summit"];
  keys.forEach((k, i) => {
    const h = FX.HOLDS.find((x) => x.k === k);
    ledgeBuf[i * 2] = h.y;
    ledgeBuf[i * 2 + 1] = h.z;
  });
})();

function render(dt) {
  resize();
  const aspect = bw / Math.max(1, bh);
  const want = desiredCam(aspect);
  if (snap || state.time < 0.05) {
    cam.pos = want.pos.slice();
    cam.look = want.look.slice();
    cam.fov = want.fov;
    snap = false;
  } else {
    const fall = clamp((-state.vy - 4) / 14, 0, 1);
    const ks = reduce ? 8 : mix(3.4, 1.35, fall);
    cam.pos = damp(cam.pos, want.pos, dt, ks);
    cam.look = damp(cam.look, want.look, dt, reduce ? 8 : 4.2);
    cam.fov = mix(cam.fov, want.fov, 1 - Math.exp(-dt * 4));
  }
  let basisPos = cam.pos.slice();
  if (!reduce && state.shake > 0.001) {
    basisPos[0] += Math.sin(state.time * 53) * state.shake * 0.18;
    basisPos[1] += Math.cos(state.time * 47) * state.shake * 0.14;
    basisPos[2] += Math.sin(state.time * 41) * state.shake * 0.12;
  }
  let basis = (function () {
    const fwd = norm(sub(cam.look, basisPos));
    let right = cross(fwd, [0, 1, 0]);
    if (vlen(right) < 1e-4) right = [0, 0, 1];
    right = norm(right);
    let up = norm(cross(right, fwd));
    const roll = reduce ? 0 : state.shake * 0.15 + clamp(-state.vy, 0, 20) * 0.0008 * Math.sin(state.time * 2.2);
    const c = Math.cos(roll), sn = Math.sin(roll);
    const rr = add(mul(right, c), mul(up, sn));
    const uu = add(mul(up, c), mul(right, -sn));
    return { fwd, right: rr, up: uu };
  })();

  const standing = state.mode === "ledge" || state.mode === "drop" || state.mode === "ending";
  const grip = gripOf();
  const hang = standing ? [0, -1, 0] : [0, -Math.cos(state.visAngle), Math.sin(state.visAngle)];
  const hold = FX.HOLDS[state.holdIndex];
  const piton = [FX.faceX(hold.y, hold.z) + 0.05, hold.y, hold.z];
  const climb = clamp((Math.max(state.y, hold.y) - 6) / 100, 0, 1);
  const day = clamp(0.5 + 0.5 * smooth(clamp((cam.look[1] - 12) / 90, 0, 1)), 0, 1);
  const sun = norm([-0.88, 0.34, 0.18]);
  const sunPoint = add(basisPos, mul(sun, 120));
  const sunRel = sub(sunPoint, basisPos);
  const sunZ = Math.max(0.2, dot(sunRel, basis.fwd));
  const sunTy = Math.tan(cam.fov * 0.5);
  const sunNdcX = (dot(sunRel, basis.right) / sunZ) / (sunTy * aspect);
  const sunNdcY = (dot(sunRel, basis.up) / sunZ) / sunTy;
  const sunUv = [sunNdcX * 0.5 + 0.5, sunNdcY * 0.5 + 0.5];
  const w01 = FX.weight01(state.mask);
  const items = FX.ITEMS;
  const item4 = [
    state.mask & items.photo.bit ? 1 : 0,
    state.mask & items.ring.bit ? 1 : 0,
    state.mask & items.trophy.bit ? 1 : 0,
    state.mask & items.letter.bit ? 1 : 0,
  ];

  const ranked = FX.HOLDS.map((h, i) => ({ h, d: Math.abs(h.y - state.y) + Math.abs(h.z - state.z) * 0.4, i }))
    .sort((a, b) => a.d - b.d)
    .slice(0, 8);
  holdBuf.fill(0);
  for (let i = 0; i < 8; i++) {
    const r = ranked[i];
    const o = i * 4;
    if (!r || r.d > 24) { holdBuf[o + 1] = -999; continue; }
    holdBuf[o] = 0;
    holdBuf[o + 1] = r.h.y;
    holdBuf[o + 2] = r.h.z;
    let flag = 1;
    if (r.h.k === "summit") flag = 4;
    else if (r.h.k !== "hold" && r.h.k !== "start") flag = 3;
    if (r.i === state.holdIndex + 1) flag = Math.max(flag, 2);
    holdBuf[o + 3] = flag;
  }
  dotBuf.fill(0);
  const dots = state.attached && state.holding && state.mode === "play" ? state.dots : [];
  const dn = Math.min(12, dots.length);
  for (let i = 0; i < 12; i++) {
    if (i < dn) {
      dotBuf[i * 3] = dots[i].x;
      dotBuf[i * 3 + 1] = dots[i].y;
      dotBuf[i * 3 + 2] = dots[i].z;
    } else dotBuf[i * 3 + 1] = -999;
  }
  let drop = [0, -999, 0, 0];
  if (state.dropT >= 0) {
    const kind = state.dropKind === "photo" ? 1 : state.dropKind === "ring" ? 2 : state.dropKind === "trophy" ? 3 : 4;
    drop = [state.dropX, state.dropY, state.dropZ, kind];
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.viewport(0, 0, bw, bh);
  gl.useProgram(sceneProg);
  gl.uniform2f(SU.uRes, bw, bh);
  gl.uniform1f(SU.uTime, state.time);
  gl.uniform1f(SU.uFov, cam.fov);
  gl.uniform1f(SU.uDay, day);
  gl.uniform1f(SU.uQ, q);
  gl.uniform1f(SU.uRope, state.attached && !standing ? 1 : 0);
  gl.uniform1f(SU.uPose, standing ? 1 : 0);
  gl.uniform1f(SU.uWeight, w01);
  gl.uniform1f(SU.uArmed, state.armed ? 1 : 0);
  gl.uniform1f(SU.uDotN, dn);
  gl.uniform1f(SU.uBurst, state.burst);
  gl.uniform1f(SU.uFade, 1);
  gl.uniform1f(SU.uSway, state.angle - state.sway);
  gl.uniform3f(SU.uCam, basisPos[0], basisPos[1], basisPos[2]);
  gl.uniform3f(SU.uFwd, basis.fwd[0], basis.fwd[1], basis.fwd[2]);
  gl.uniform3f(SU.uRight, basis.right[0], basis.right[1], basis.right[2]);
  gl.uniform3f(SU.uUp, basis.up[0], basis.up[1], basis.up[2]);
  gl.uniform3f(SU.uSun, sun[0], sun[1], sun[2]);
  gl.uniform3f(SU.uGrip, grip[0], grip[1], grip[2]);
  gl.uniform3f(SU.uHang, hang[0], hang[1], hang[2]);
  gl.uniform3f(SU.uPiton, piton[0], piton[1], piton[2]);
  gl.uniform2f(SU.uVel, state.vz, state.vy);
  gl.uniform4f(SU.uItems, item4[0], item4[1], item4[2], item4[3]);
  gl.uniform4fv(SU["uHolds[0]"], holdBuf);
  gl.uniform3fv(SU["uDots[0]"], dotBuf);
  gl.uniform2fv(SU["uLedge[0]"], ledgeBuf);
  gl.uniform4f(SU.uDrop, drop[0], drop[1], drop[2], drop[3]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  const fade = smooth(clamp(state.time / 1.25, 0, 1));
  const flash = state.mode === "impact" ? clamp(1 - state.impactT / 0.28, 0, 1) : state.resetFade * 0.65;
  const fallAmt = clamp((-state.vy - 6) / 22, 0, 1);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, bw, bh);
  gl.useProgram(compProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(CU.uTex, 0);
  gl.uniform2f(CU.uRes, bw, bh);
  gl.uniform2f(CU.uSunUv, sunUv[0], sunUv[1]);
  gl.uniform1f(CU.uTime, state.time);
  gl.uniform1f(CU.uDay, day);
  gl.uniform1f(CU.uFade, fade);
  gl.uniform1f(CU.uFlash, flash);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  return { day, climb };
}

function ttext(zh, en) { return lang === "en" ? en : zh; }
function syncUI() {
  const U = FX.UI;
  ui.lang.textContent = lang === "en" ? "中" : "EN";
  ui.restart.textContent = ttext(U.restartZh, U.restartEn);
  ui.again.textContent = ttext(U.againZh, U.againEn);
  ui.mute.classList.toggle("off", muted);
  ui.sub.textContent = "LET GO";
  const titleA = smooth(clamp((state.time - 0.45) / 0.8, 0, 1)) * smooth(clamp((state.intro - 0.08) / 0.5, 0, 1));
  ui.title.style.opacity = String(state.mode === "ending" ? 0 : titleA);
  const early = state.catches < 4 && state.mode === "play";
  const hintText = state.failedOnce && !state.airCatch ? ttext(U.hintFallZh, U.hintFallEn) : ttext(U.hintZh, U.hintEn);
  ui.hint.textContent = hintText;
  ui.hint.style.opacity = early && titleA < 0.85 ? String(smooth(clamp((state.time - 1.5) / 0.5, 0, 1)) * (1 - titleA * 0.25)) : "0";
  if (state.mode !== "play") ui.hint.style.opacity = "0";

  const alt = state.attached ? FX.HOLDS[state.holdIndex].y : state.y;
  const pct = clamp(alt / FX.SUMMIT_Y, 0, 1);
  ui.now.style.bottom = pct * 100 + "%";
  ui.alt.textContent = Math.max(0, Math.round(alt)) + (lang === "zh" ? "米" : "m");
  const bp = clamp(bestSaved / FX.SUMMIT_Y, 0, 1);
  ui.best.style.bottom = bp * 100 + "%";
  ui.best.style.opacity = bestSaved > 8 ? "0.9" : "0";

  const showCard = state.mode === "ledge" || state.mode === "drop";
  ui.card.classList.toggle("show", showCard);
  if (showCard) {
    const h = FX.HOLDS[state.holdIndex];
    const spec = FX.ITEMS[h.k];
    if (spec) {
      ui.cardName.textContent = ttext(spec.zh, spec.en);
      ui.cardLine.textContent = ttext(spec.lineZh, spec.lineEn);
    }
    ui.howHold.textContent = ttext(U.holdZh, U.holdEn);
    ui.howTap.textContent = ttext(U.tapZh, U.tapEn);
    const p = state.mode === "ledge" ? clamp(state.pressT / 0.62, 0, 1) : 1;
    ui.ring.style.setProperty("--p", String(p * 100));
  }
  const showEnd = state.mode === "ending" && state.endingT > 0.8;
  ui.ending.classList.toggle("show", showEnd);
  if (state.mode === "ending") {
    const lines = (FX.ENDINGS[state.mask] || FX.ENDINGS[15])[lang === "en" ? "en" : "zh"];
    ui.e1.textContent = lines[0];
    ui.e2.textContent = lines[1];
    ui.e3.textContent = lines[2];
  }
  ui.restart.style.visibility = state.mode === "ending" ? "hidden" : "visible";
}

let acc = 0;
let last = 0;
let frames = 0;
let readyResolve;
const ready = new Promise((r) => { readyResolve = r; });
let readySent = false;

function frame(now) {
  try {
  if (!last) last = now;
  const raw = Math.min(0.05, Math.max(0.0, (now - last) / 1000));
  last = now;
  frameMs.push(raw);
  if (frameMs.length > 40) frameMs.shift();
  frames++;
  if (!shot && frames % 50 === 0 && frameMs.length > 20) {
    const avg = frameMs.reduce((a, b) => a + b, 0) / frameMs.length;
    if (avg > 0.022) {
      if (scale > 0.45) scale = Math.max(0.45, scale * 0.88);
      else if (q > 0) q -= 1;
    } else if (avg < 0.014 && scale < (coarse ? 0.85 : 1)) {
      scale = Math.min(coarse ? 0.85 : 1, scale * 1.05);
    }
  }
  acc += raw;
  const sounds = [];
  const input = { holding, restart: restartPulse, skipIntro: rush || reduce, freezeIntro: false };
  restartPulse = false;
  let n = 0;
  while (acc >= 1 / 120 && n < 6) {
    FX.step(state, 1 / 120, input);
    if (state.sfx && state.sfx.length) sounds.push.apply(sounds, state.sfx);
    acc -= 1 / 120;
    n++;
    input.restart = false;
    input.skipIntro = rush || reduce;
  }
  const peak = Math.round(state.bestRun);
  if (peak > bestSaved) {
    bestSaved = peak;
    writeSave({ best: bestSaved, mute: muted, lang });
    tone(587, 0.35, "sine", 0.03);
  }
  playSfx(sounds);
  const alt = state.attached ? FX.HOLDS[state.holdIndex].y : state.y;
  music(raw, alt, state.mode);
  render(raw);
  syncUI();
  if (!readySent && state.time > 0.05) {
    readySent = true;
    readyResolve(true);
  }
  } catch (err) {
    console.error("frame", err && err.stack || err);
    if (!readySent) { readySent = true; readyResolve(false); }
  }
  requestAnimationFrame(frame);
}

function unlock() {
  audioStart();
  if (audio.ctx && audio.ctx.state === "suspended") audio.ctx.resume();
}
document.addEventListener("pointerdown", (e) => {
  unlock();
  if (e.target.closest("button")) return;
  holding = true;
  rush = true;
}, { passive: false });
document.addEventListener("pointerup", () => { holding = false; });
document.addEventListener("pointercancel", () => { holding = false; });
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); if (!e.repeat) { holding = true; rush = true; unlock(); } }
  else if (e.code === "KeyR") { restartPulse = true; }
  else if (e.code === "KeyM") setMuted(!muted);
  else if (e.code === "KeyL") toggleLang();
});
document.addEventListener("keyup", (e) => { if (e.code === "Space") holding = false; });
ui.mute.addEventListener("click", () => setMuted(!muted));
function toggleLang() {
  lang = lang === "zh" ? "en" : "zh";
  writeSave({ best: bestSaved, mute: muted, lang });
  syncUI();
}
ui.lang.addEventListener("click", toggleLang);
function fullRestart() { restartPulse = true; rush = true; unlock(); }
ui.restart.addEventListener("click", fullRestart);
ui.again.addEventListener("click", fullRestart);
setMuted(muted);
syncUI();
requestAnimationFrame(frame);

window.__fx = {
  ready,
  get q() { return q; },
  get scale() { return scale; },
  state() {
    return {
      mode: state.mode, y: state.y, z: state.z, mask: state.mask, hold: state.holdIndex,
      catches: state.catches, falls: state.falls, intro: state.intro, attached: state.attached,
      endingT: state.endingT, time: state.time,
    };
  },
  teleport(i) {
    const h = FX.HOLDS[i];
    state.holdIndex = i;
    state.attached = true;
    state.mode = "play";
    state.settle = 1;
    state.holdT = 0;
    state.intro = 0;
    state.vy = 0;
    state.vz = 0;
    state.angle = 0;
    state.visAngle = 0;
    state.y = h.y - FX.L;
    state.z = h.z;
    state.origin = i;
    state.flightT = 0;
    state.dots = [];
    state.catches = 6;
    state.launches = 4;
    snap = true;
  },
  mask(m) { state.mask = m; },
  fallFrom(i) {
    this.teleport(i);
    const h = FX.HOLDS[i];
    state.attached = false;
    state.mode = "play";
    state.vy = -18;
    state.vz = 1.2;
    state.y = h.y - 4.2;
    state.z = h.z + 1.6;
    state.flightT = 0.55;
    state.origin = i;
    state.angle = Math.atan2(-state.vz, state.vy);
    state.visAngle = state.angle;
    snap = true;
  },
  ending(mask) {
    this.teleport(FX.HOLDS.length - 1);
    state.mask = mask;
    state.mode = "ending";
    state.endingT = 2.2;
    const h = FX.HOLDS[state.holdIndex];
    state.y = h.y + 0.22;
    state.z = h.z;
    snap = true;
  },
  errors() { return ui.err.textContent; },
};
