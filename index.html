  f.type = "lowpass"; f.frequency.value = 400;
  const g = ac.createGain(); g.gain.value = 0.0;
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start();
  ac._wind = g; ac._filt = f;
}
function gustAudio(fc) {
  if (muted) return;
  ensureAudio();
  if (!ac) return;
  const amp = Math.min(0.08, 0.004 + Math.abs(fc.now) * 0.02 + Math.abs(fc.soon) * 0.012);
  ac._wind.gain.setTargetAtTime(amp, ac.currentTime, 0.2);
  ac._filt.frequency.setTargetAtTime(280 + Math.abs(fc.soon) * 500, ac.currentTime, 0.3);
  const coming = Math.abs(fc.soon) > Math.abs(fc.now) + 0.25 && Math.abs(fc.soon) > 0.45;
  if (coming && !gustOn) {
    gustOn = true;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(90, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(220, ac.currentTime + 0.7);
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.04, ac.currentTime + 0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.95);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + 1);
  }
  if (!coming) gustOn = false;
}
function tone(freq, dur, type, gain) {
  if (!ac || muted) return;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type || "sine";
  o.frequency.value = freq;
  g.gain.setValueAtTime(gain || 0.05, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur);
}
function playSfx(list) {
  if (!list || muted) return;
  ensureAudio();
  list.forEach(function (s) {
    if (s === "catch" || s === "land") tone(s === "land" ? 90 : 180, 0.12, "sine", 0.06);
    else if (s === "release") tone(240, 0.08, "triangle", 0.04);
    else if (s === "arm") tone(520, 0.06, "sine", 0.03);
    else if (s === "impact") tone(50, 0.3, "sawtooth", 0.07);
    else if (s === "summit") tone(330, 0.5, "sine", 0.05);
    else if (s === "slip") tone(140, 0.15, "triangle", 0.04);
  });
}

function syncUI(fc, dt) {
  const dropped = state.lost && state.lost.length;
  if (!state.crown) { backT = -1; backWait = true; }
  else if (backWait && dropped && state.attached) { backT = 0; backWait = false; }
  if (backT >= 0) {
    if (holding && backT > 0.18) backT = -1;
    else { backT += dt; if (backT > 3.4) backT = -1; }
  }
  ui.back.style.opacity = state.mode !== "ending" && backT > 0.2 && backT < 3.2 ? "0.86" : "0";
  if (backT > 0) {
    const hold = FX.HOLDS[state.holdIndex];
    ui.back.style.left = "18%";
    ui.back.style.top = (innerHeight * 0.42) + "px";
    ui.back.style.transform = "none";
  }
  if (!shot && prologueLeft > 0 && state.intro > 0.2) {
    prologueLeft -= dt;
    ui.prologue.classList.add("show");
    if (holding) prologueLeft = Math.min(prologueLeft, 0.4);
  } else ui.prologue.classList.remove("show");
  ui.hint.style.opacity = state.intro < 0.15 && state.catches < 2 && state.mode === "play" ? "0.8" : "0";
  ui.hint.textContent = state.attached ? "按住蓄力，弧线碰到岩点再松开" : "下坠时按住，也许还能抓住";
  const showPack = state.mode === "ledge";
  ui.pack.classList.toggle("show", showPack);
  if (showPack) {
    ui.packItems.innerHTML = "";
    FX.ORDER.forEach(function (k) {
      const spec = FX.ITEMS[k];
      if (!(state.mask & spec.bit)) return;
      const b = document.createElement("button");
      b.className = "mem"; b.type = "button";
      b.innerHTML = "<div><b></b><span></span></div><i>放下</i>";
      b.querySelector("b").textContent = spec.zh;
      b.querySelector("span").textContent = spec.lineZh;
      b.addEventListener("pointerdown", function (e) { e.stopPropagation(); e.preventDefault(); });
      b.addEventListener("pointerup", function (e) {
        e.stopPropagation(); e.preventDefault();
        wantDrop = k;
      });
      ui.packItems.appendChild(b);
    });
  }
  if (state.dropT >= 0 && state.dropKind && FX.ITEMS[state.dropKind]) {
    ui.whisper.textContent = FX.ITEMS[state.dropKind].lineZh;
    const t = state.dropT;
    const a = t < 0.35 ? t / 0.35 : t > 1.4 ? Math.max(0, 1 - (t - 1.4) / 0.6) : 1;
    ui.whisper.style.opacity = String(a * 0.92);
  } else if (state.reveal && state.revealT >= 0 && FX.ITEMS[state.reveal]) {
    ui.whisper.textContent = FX.ITEMS[state.reveal].backZh;
    ui.whisper.style.opacity = "0.85";
  } else ui.whisper.style.opacity = "0";
  const showEnd = state.mode === "ending" && state.endingT > 0.7;
  ui.ending.classList.toggle("show", showEnd);
  if (showEnd) {
    const lines = (FX.ENDINGS[state.mask] || FX.ENDINGS[15]).zh;
    ui.passage.textContent = lines.join("");
    ui.retrieve.style.display = dropped ? "inline-block" : "none";
    const bit = 1 << (state.mask & 15);
    if ((found & bit) === 0) { found |= bit; persist();
      ui.marks.children[state.mask & 15].className = "on";
    }
  }
  ui.marks.classList.toggle("show", showEnd || prologueLeft > 0);
  const top = FX.HOLDS[FX.HOLDS.length - 1].y;
  const t = 1 - clamp01((state.y - 8) / (top - 8));
  ui.now.style.top = (t * 100) + "%";
  ui.alt.textContent = Math.max(0, Math.round(state.y)) + "米";
  const bt = 1 - clamp01((bestEver - 8) / (top - 8));
  ui.best.style.top = (bt * 100) + "%";
}

ui.mute.addEventListener("pointerup", function (e) {
  e.stopPropagation(); muted = !muted; ui.mute.classList.toggle("off", muted);
  ui.mute.textContent = muted ? "静" : "声"; persist();
});
ui.restart.addEventListener("pointerup", function (e) { e.stopPropagation(); restartPulse = true; });
ui.again.addEventListener("pointerup", function (e) { e.stopPropagation(); restartPulse = true; });
ui.retrieve.addEventListener("pointerup", function (e) { e.stopPropagation(); wantRetrieve = true; });
ui.packKeep.addEventListener("pointerup", function (e) { e.stopPropagation(); wantKeep = true; });
function down(e) {
  if (e.target.closest && e.target.closest("button")) return;
  holding = true; ensureAudio();
  if (ac && ac.state === "suspended") ac.resume();
}
function up() { holding = false; }
canvas.addEventListener("pointerdown", down);
window.addEventListener("pointerup", up);
window.addEventListener("pointercancel", up);
addEventListener("keydown", function (e) { if (e.code === "Space") { e.preventDefault(); holding = true; ensureAudio(); } });
addEventListener("keyup", function (e) { if (e.code === "Space") holding = false; });

function applyShot(name) {
  const n = FX.HOLDS.length;
  const mid = FX.HOLDS[Math.floor(n * 0.42)];
  const high = FX.HOLDS[Math.floor(n * 0.86)];
  state.intro = 0; state.settle = 1; state.mode = "play";
  if (name === "base") {
    state.holdIndex = 2; state.origin = 2; state.mask = 0; state.stormVis = 0.02;
  } else if (name === "storm") {
    state.holdIndex = Math.floor(n * 0.42); state.origin = state.holdIndex; state.mask = 15; state.stormVis = 1;
  } else if (name === "gale") {
    state.holdIndex = Math.floor(n * 0.86); state.origin = state.holdIndex; state.mask = 15; state.stormVis = 1;
  } else if (name === "ending" || name === "choices") {
    state.holdIndex = n - 1; state.origin = n - 1; state.mask = 9; state.mode = "ending"; state.endingT = 2;
    state.lost = [{ kind: "trophy", bit: 4, y: mid.y, z: mid.z, hold: mid.i }];
    state.crown = true;
  }
  const h = FX.HOLDS[state.holdIndex];
  state.attached = true; state.y = h.y - 0.4; state.z = h.z;
  camY = state.y; focusZ = state.z;
}
if (shotName) applyShot(shotName);
resize();
requestAnimationFrame(frame);
</script>
